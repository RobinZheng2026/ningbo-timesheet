lick="closeEditModal()">取消</button></div></div></div>

let currentWeekRecords=[],isSubmitting=false,editingRowId="",employeeAuthorized=false;function $(id){return document.getElementById(id)}function getParam(n){return new URL(location.href).searchParams.get(n)}function num(v){const n=Number(v);return Number.isFinite(n)?n:0}function safe(v){return String(v??"").replace(/[<>&"]/g,s=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[s]))}function showMsg(t,ok=true){const e=$("msg");e.className="msg "+(ok?"ok":"err");e.innerHTML=t}function isWeekendDay(d){return d==="六"||d==="日"}function needsProjectByTask(t){return !TASKS_NO_PROJECT.includes(t||"")}function needsUnitByTask(t){return !(TASKS_NO_PROJECT.includes(t||"")||TASKS_PROJECT_ONLY.includes(t||""))}function needsProject(){return needsProjectByTask(state.task)}function needsUnit(){return needsUnitByTask(state.task)}
const empId=getParam("id"),empName=empId?employeeMap[empId]:"";function authKeyName(){return "NINGBO_WORKSHOP_EMP_KEY_OK_"+String(empId||"")}function isEmployeeKeyValid(k){return String(k||"").trim()===String(employeeKeyMap[empId]||"").trim()&&!!employeeKeyMap[empId]}function verifyEmployeeKey(){if(!empId||!empName)return false;const old=localStorage.getItem(authKeyName());if(old&&isEmployeeKeyValid(old)){employeeAuthorized=true;return true}const input=prompt("请输入你的个人验证码：");if(isEmployeeKeyValid(input)){employeeAuthorized=true;localStorage.setItem(authKeyName(),String(input).trim());return true}employeeAuthorized=false;localStorage.removeItem(authKeyName());return false}function requireAuth(alertMode=false){if(employeeAuthorized)return true;if(verifyEmployeeKey())return true;const m="身份验证码验证失败，禁止操作。";alertMode?alert(m):showMsg(m,false);return false}function resetEmployeeKey(){if(!empId)return;localStorage.removeItem(authKeyName());employeeAuthorized=false;alert("已清除当前员工验证码缓存。")}

function renderChips(id,vals,field,onClick,targetState=state){const c=$(id);c.innerHTML="";if(!vals||!vals.length){c.innerHTML='<div class="chip disabled">'+(field==="unit"?"请先选项目":"暂无数据")+'</div>';return}vals.forEach(v=>{const d=document.createElement("div");d.className="chip"+(targetState[field]===v?" active":"");d.innerText=v;d.onclick=()=>onClick(v);c.appendChild(d)})}function renderActive(){document.querySelectorAll("#weekChips .chip,#weekdayChips .chip,#taskChips .chip,#projectChips .chip,#unitChips .chip").forEach(c=>c.classList.remove("active"));document.querySelectorAll("#weekChips .chip").forEach(c=>{if(c.innerText===state.week)c.classList.add("active")});document.querySelectorAll("#weekdayChips .chip").forEach(c=>{if(c.innerText===state.weekday)c.classList.add("active")});document.querySelectorAll("#taskChips .chip").forEach(c=>{if(c.innerText===state.task)c.classList.add("active")});document.querySelectorAll("#projectChips .chip").forEach(c=>{if(c.innerText===state.project)c.classList.add("active")});document.querySelectorAll("#unitChips .chip").forEach(c=>{if(c.innerText===state.unit)c.classList.add("active")})}function disabledChip(id,text){$(id).innerHTML='<div class="chip disabled">'+text+'</div>'}function renderProjects(){if(!needsProject())return disabledChip("projectChips","该类别无需项目号");renderChips("projectChips",Object.keys(projectUnits),"project",v=>{state.project=v;state.unit="";renderUnits();renderActive()})}function renderUnits(){if(!needsUnit())return disabledChip("unitChips","该类别无需单元号");renderChips("unitChips",state.project&&projectUnits[state.project]?projectUnits[state.project]:[],"unit",v=>{state.unit=v;renderActive()})}function applyTaskRules(){if(!needsProject()){state.project="";state.unit=""}else if(!needsUnit()){state.unit=""}renderProjects();renderUnits();renderActive()}function renderQuick(){row("regularHoursQuick","regularHours",quick.regularHours,true,state,setNumber);row("otWeekdayQuick","otWeekday",quick.otWeekday,false,state,setNumber);row("otWeekendQuick","otWeekend",quick.otWeekend,false,state,setNumber)}function row(id,field,vals,regular,obj,setter){$(id).innerHTML="";vals.forEach(v=>{let b=document.createElement("button");b.className="quick-btn";b.type="button";b.innerText=v===0?(regular?"0小时":"清零"):v+"小时";b.onclick=()=>setter(field,v);$(id).appendChild(b)})}function refresh(){$("regularHoursDisplay").innerText=state.regularHours;$("otWeekdayDisplay").innerText=state.otWeekday;$("otWeekendDisplay").innerText=state.otWeekend}function maxH(f){return f==="regularHours"?8:f==="otWeekday"?4:8}function changeNumber(f,d){let n=Math.round((num(state[f])+d)*2)/2;state[f]=Math.max(0,Math.min(n,maxH(f)));refresh()}function setNumber(f,v){state[f]=Math.max(0,Math.min(num(v),maxH(f)));refresh()}function disableRegular(x){$("regularMinus").disabled=x;$("regularPlus").disabled=x;document.querySelectorAll("#regularHoursQuick .quick-btn").forEach(b=>b.disabled=x)}function syncHourSectionByWeekday(){if(!state.weekday){refresh();return}if(isWeekendDay(state.weekday)){state.regularHours=0;state.otWeekday=0;$("weekdayOTCard").classList.add("hidden");$("weekendOTCard").classList.remove("hidden");disableRegular(true)}else{if(state.regularHours===0)state.regularHours=8;state.otWeekend=0;$("weekdayOTCard").classList.remove("hidden");$("weekendOTCard").classList.add("hidden");disableRegular(false)}refresh()}
async function loadWeekRecords(){if(!state.week||!empId){currentWeekRecords=[];renderWeekRecords([]);return}if(!requireAuth(false)){currentWeekRecords=[];renderWeekRecords([],"身份验证码验证失败，禁止读取记录。");return}if(!getApiToken())return renderWeekRecords([],"未检测到 Baserow Token。请联系管理员。") ;try{const res=await fetch(apiUrl(),{headers:headers()});if(!res.ok)throw new Error("读取记录失败："+res.status);const data=await res.json();let rows=Array.isArray(data)?data:(data.results||[]);rows=rows.filter(r=>String(r.employeeId||"")===String(empId)&&String(r.week||"")===String(state.week));rows.sort((a,b)=>new Date(a.submitTime||0)-new Date(b.submitTime||0));currentWeekRecords=rows;renderWeekRecords(rows)}catch(e){currentWeekRecords=[];renderWeekRecords([],"本周记录读取失败："+e.message)}}
function renderWeekRecords(rows,err=""){const box=$("recordList");if(err){box.innerHTML='<div class="record-empty">'+safe(err)+'</div>';return}if(!state.week){box.innerHTML='<div class="record-empty">请选择 Week 查看本周记录</div>';return}if(!rows.length){box.innerHTML='<div class="record-empty">当前员工在 '+safe(state.week)+' 还没有提交记录</div>';return}let sum={};weekdayOptions.forEach(d=>sum[d]={r:0,o:0});let map=new Map(),totalR=0,totalOW=0,totalOE=0;rows.forEach(r=>{let k=[r.task||"",r.project||"",r.unit||"",String(r.remark||"").trim()].join("||");if(!map.has(k)){let days={};weekdayOptions.forEach(d=>days[d]={r:0,o:0});map.set(k,{task:r.task||"",project:r.project||"",unit:r.unit||"",remark:String(r.remark||"").trim(),days,totalR:0,totalOW:0,totalOE:0})}let m=map.get(k),d=r.weekday,rg=num(r.regularHours),ot=num(r.otWeekday)+num(r.otWeekend);if(m.days[d]){m.days[d].r+=rg;m.days[d].o+=ot}m.totalR+=rg;m.totalOW+=num(r.otWeekday);m.totalOE+=num(r.otWeekend);if(sum[d]){sum[d].r+=rg;sum[d].o+=ot}totalR+=rg;totalOW+=num(r.otWeekday);totalOE+=num(r.otWeekend)});let head='<thead><tr><th rowspan="2">工时类别</th><th rowspan="2">项目号</th><th rowspan="2">单元号</th><th rowspan="2">备注</th>'+['周一','周二','周三','周四','周五'].map(x=>'<th colspan="2">'+x+'</th>').join('')+'<th>周六</th><th>周日</th><th colspan="3">汇总</th></tr><tr>'+Array(5).fill('<th>正常<br>出勤</th><th>实际<br>加班</th>').join('')+'<th>实际<br>加班</th><th>实际<br>加班</th><th>正常<br>出勤</th><th>实际晚<br>上加班</th><th>实际周<br>末加班</th></tr></thead>';let body="";map.forEach(m=>{body+='<tr><td class="cell-left">'+safe(m.task)+'</td><td>'+safe(m.project)+'</td><td>'+safe(m.unit)+'</td><td>'+safe(m.remark)+'</td>'+['一','二','三','四','五'].map(d=>'<td>'+(m.days[d].r||"")+'</td><td>'+(m.days[d].o||"")+'</td>').join('')+'<td>'+(m.days['六'].o||"")+'</td><td>'+(m.days['日'].o||"")+'</td><td>'+(m.totalR||"")+'</td><td>'+(m.totalOW||"")+'</td><td>'+(m.totalOE||"")+'</td></tr>'});const cls=w=>w?' class="warn-cell"':'';let sumrow='<tr><td></td><td></td><td></td><td><b>汇总</b></td>'+['一','二','三','四','五'].map(d=>'<td'+cls(sum[d].r!==8)+'>'+(sum[d].r||0)+'</td><td'+cls(!(sum[d].o===0||sum[d].o===4))+'>'+(sum[d].o||0)+'</td>').join('')+'<td>'+(sum['六'].o||0)+'</td><td>'+(sum['日'].o||0)+'</td><td>'+(totalR||0)+'</td><td>'+(totalOW||0)+'</td><td>'+(totalOE||0)+'</td></tr>';let raw="";rows.forEach(r=>raw+='<tr><td>'+safe(r.weekday)+'</td><td class="cell-left">'+safe(r.task)+'</td><td>'+safe(r.project)+'</td><td>'+safe(r.unit)+'</td><td>'+num(r.regularHours)+'</td><td>'+num(r.otWeekday)+'</td><td>'+num(r.otWeekend)+'</td><td>'+safe(r.remark||"")+'</td><td><button class="small-btn edit-btn" onclick="openEditModal(\''+safe(r.id)+'\')">修改</button><button class="small-btn delete-btn" onclick="deleteRecord(\''+safe(r.id)+'\')">删除</button></td></tr>');box.innerHTML='<div class="table-scroll"><table>'+head+'<tbody>'+body+sumrow+'</tbody></table></div><div class="sec-title">原始记录管理</div><div class="table-scroll"><table><thead><tr><th>星期</th><th>工时类别</th><th>项目号</th><th>单元号</th><th>正常</th><th>工作日<br>加班</th><th>周末<br>加班</th><th>备注</th><th>操作</th></tr></thead><tbody>'+raw+'</tbody></table></div>'}
function dayTotals(week,day,exclude){let t={r:0,ow:0,oe:0};currentWeekRecords.forEach(r=>{if(String(r.id)===String(exclude||""))return;if(r.week!==week||r.weekday!==day)return;t.r+=num(r.regularHours);t.ow+=num(r.otWeekday);t.oe+=num(r.otWeekend)});return t}function signature(p){return JSON.stringify({employeeId:p.employeeId,week:p.week,weekday:p.weekday,task:p.task,project:p.project,unit:p.unit,regularHours:num(p.regularHours),otWeekday:num(p.otWeekday),otWeekend:num(p.otWeekend),remark:String(p.remark||"").trim()})}function duplicate(sig,exclude){return currentWeekRecords.some(r=>String(r.id)!==String(exclude||"")&&signature(r)===sig)}function validate(p,exclude){if(!p.employeeId||!employeeMap[p.employeeId])return"未识别到有效员工信息，请使用员工专属二维码扫码。";if(!p.week)return"请选择 Week。";if(!p.weekday)return"请选择星期。";if(!p.task)return"请选择工时类别。";if(needsProjectByTask(p.task)&&!p.project)return"请选择项目号。";if(needsUnitByTask(p.task)&&!p.unit)return"请选择单元号。";let r=num(p.regularHours),ow=num(p.otWeekday),oe=num(p.otWeekend),wk=isWeekendDay(p.weekday);if(r<0||r>8)return"正常工时单条记录必须在 0~8 小时之间。";if(ow<0||ow>4)return"工作日加班单条记录必须在 0~4 小时之间。";if(oe<0||oe>8)return"周末加班单条记录必须在 0~8 小时之间。";if(wk&&(r!==0||ow!==0))return"周末不能填写正常工时或工作日加班。";if(!wk&&oe!==0)return"工作日不能填写周末加班。";let t=dayTotals(p.week,p.weekday,exclude);if(t.r+r>8)return"提交后当天正常工时汇总为 "+(t.r+r)+"h，超过 8h，禁止提交。";if(!wk&&t.ow+ow>4)return"提交后当天工作日加班汇总为 "+(t.ow+ow)+"h，超过 4h，禁止提交。";if(wk&&t.oe+oe>8)return"提交后当天周末加班汇总为 "+(t.oe+oe)+"h，超过 8h，禁止提交。";if(duplicate(signature(p),exclude))return"已存在一条完全相同的记录，无需重复提交。";return""}
async function submitForm(){if(isSubmitting)return showMsg("正在提交中，请勿重复点击。",false);if(!requireAuth(false))return;if(!getApiToken())return showMsg("未检测到 Baserow Token，请联系管理员。",false);const p={submitTime:new Date().toISOString(),employeeId:empId,employeeName:empName,week:state.week,weekday:state.weekday,task:state.task,project:needsProject()?state.project:"",unit:needsUnit()?state.unit:"",regularHours:num(state.regularHours),otWeekday:num(state.otWeekday),otWeekend:num(state.otWeekend),remark:$("remark").value||""};const e=validate(p,"");if(e)return showMsg(e,false);try{isSubmitting=true;$("submitBtn").disabled=true;showMsg("正在提交，请稍候…",true);const res=await fetch(apiUrl(),{method:"POST",headers:headers(),body:JSON.stringify(p)});if(!res.ok)throw new Error(res.status);showMsg("✅ 提交成功。",true);state.weekday="";state.task="";state.project="";state.unit="";state.regularHours=8;state.otWeekday=0;state.otWeekend=0;$("remark").value="";applyTaskRules();renderActive();refresh();syncHourSectionByWeekday();await loadWeekRecords()}catch(e){showMsg("❌ 提交失败："+e.message,false)}finally{isSubmitting=false;$("submitBtn").disabled=!(empId&&empName&&employeeAuthorized)}}
function editRefresh(){$("editRegularDisplay").innerText=editState.regularHours;$("editOtWeekdayDisplay").innerText=editState.otWeekday;$("editOtWeekendDisplay").innerText=editState.otWeekend}function editChangeNumber(f,d){let n=Math.round((num(editState[f])+d)*2)/2;editState[f]=Math.max(0,Math.min(n,maxH(f)));editRefresh()}function editSetNumber(f,v){editState[f]=Math.max(0,Math.min(num(v),maxH(f)));editRefresh()}function renderEditQuick(){row("editRegularQuick","regularHours",quick.regularHours,true,editState,editSetNumber);row("editOtWeekdayQuick","otWeekday",quick.otWeekday,false,editState,editSetNumber);row("editOtWeekendQuick","otWeekend",quick.otWeekend,false,editState,editSetNumber)}function editSyncDay(){if(isWeekendDay(editState.weekday)){editState.regularHours=0;editState.otWeekday=0;$("editWeekdayOTCard").classList.add("hidden");$("editWeekendOTCard").classList.remove("hidden")}else{editState.otWeekend=0;$("editWeekdayOTCard").classList.remove("hidden");$("editWeekendOTCard").classList.add("hidden")}editRefresh()}function renderEditAll(){$("editWeekText").innerText=editState.week;renderChips("editWeekdayChips",weekdayOptions,"weekday",v=>{editState.weekday=v;editSyncDay();renderEditAll()},editState);renderChips("editTaskChips",taskOptions,"task",v=>{editState.task=v;if(!needsProjectByTask(v)){editState.project="";editState.unit=""}else if(!needsUnitByTask(v))editState.unit="";renderEditAll()},editState);if(!needsProjectByTask(editState.task))disabledChip("editProjectChips","该类别无需项目号");else renderChips("editProjectChips",Object.keys(projectUnits),"project",v=>{editState.project=v;editState.unit="";renderEditAll()},editState);if(!needsUnitByTask(editState.task))disabledChip("editUnitChips","该类别无需单元号");else renderChips("editUnitChips",editState.project&&projectUnits[editState.project]?projectUnits[editState.project]:[],"unit",v=>{editState.unit=v;renderEditAll()},editState);renderEditQuick();editSyncDay()}function openEditModal(id){if(!requireAuth(false))return;const r=currentWeekRecords.find(x=>String(x.id)===String(id));if(!r)return showMsg("未找到要修改的记录。",false);if(String(r.employeeId)!==String(empId))return showMsg("非法操作：只能修改自己的记录。",false);editingRowId=String(id);editState={week:r.week||state.week,weekday:r.weekday||"",task:r.task||"",project:r.project||"",unit:r.unit||"",regularHours:num(r.regularHours),otWeekday:num(r.otWeekday),otWeekend:num(r.otWeekend),remark:r.remark||""};$("editRemark").value=editState.remark;renderEditAll();$("editModal").classList.remove("hidden")}function closeEditModal(){editingRowId="";$("editModal").classList.add("hidden")}
async function saveEdit(){if(!editingRowId)return alert("未找到要修改的记录。");if(!requireAuth(true))return;const old=currentWeekRecords.find(x=>String(x.id)===String(editingRowId));if(old&&String(old.employeeId)!==String(empId))return alert("非法操作：只能修改自己的记录。");let wk=isWeekendDay(editState.weekday);const p={employeeId:empId,employeeName:empName,week:editState.week,weekday:editState.weekday,task:editState.task,project:needsProjectByTask(editState.task)?editState.project:"",unit:needsUnitByTask(editState.task)?editState.unit:"",regularHours:wk?0:num(editState.regularHours),otWeekday:wk?0:num(editState.otWeekday),otWeekend:wk?num(editState.otWeekend):0,remark:$("editRemark").value||""};const e=validate(p,editingRowId);if(e)return alert(e);if(!confirm("确认修改这条记录吗？"))return;try{const res=await fetch(rowUrl(editingRowId),{method:"PATCH",headers:headers(),body:JSON.stringify(p)});if(!res.ok)throw new Error(res.status);closeEditModal();showMsg("✅ 修改成功。",true);await loadWeekRecords()}catch(e){alert("❌ 修改失败："+e.message)}}async function deleteRecord(id){if(!requireAuth(false))return;const r=currentWeekRecords.find(x=>String(x.id)===String(id));if(!r)return showMsg("未找到要删除的记录。",false);if(String(r.employeeId)!==String(empId))return showMsg("非法操作：只能删除自己的记录。",false);if(!confirm("确认删除这条记录吗？\n\n星期："+(r.weekday||"")+"\n工时类别："+(r.task||"")+"\n项目号："+(r.project||"")+"\n单元号："+(r.unit||"")+"\n正常工时："+num(r.regularHours)+"h\n工作日加班："+num(r.otWeekday)+"h\n周末加班："+num(r.otWeekend)+"h"))return;if(!confirm("删除后无法在本页面恢复。请再次确认：是否永久删除？"))return;try{const res=await fetch(rowUrl(id),{method:"DELETE",headers:headers(false)});if(!res.ok)throw new Error(res.status);showMsg("✅ 删除成功。",true);await loadWeekRecords()}catch(e){showMsg("❌ 删除失败："+e.message,false)}}
function init(){if(getParam("admin")==="1")$("tokenBtns").style.display="grid";initEmployee();renderChips("weekChips",weekOptions,"week",async v=>{state.week=v;renderActive();await loadWeekRecords()});renderChips("weekdayChips",weekdayOptions,"weekday",v=>{state.weekday=v;syncHourSectionByWeekday();renderActive()});renderChips("taskChips",taskOptions,"task",v=>{state.task=v;applyTaskRules();renderActive()});applyTaskRules();renderQuick();refresh();renderActive()}init();
</script></body></html>
