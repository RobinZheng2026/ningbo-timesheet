<script>

// ✅ 新增：编辑ID
let editingId = null;

// ✅ ✅ ✅ 强校验（完全替换原 validate）
function validate(){

  if(!empId || !empName)
    return "未识别到员工";

  if(!state.week) return "请选择Week";
  if(!state.weekday) return "请选择星期";
  if(!state.task) return "请选择工时类别";

  if(needsProject() && !state.project)
    return "请选择项目号";

  if(needsUnit() && !state.unit)
    return "请选择单元号";

  // ✅ 当前天已有记录（排除编辑）
  let dayRecords = currentWeekRecords.filter(r =>
    r.weekday === state.weekday
  );

  if(editingId){
    dayRecords = dayRecords.filter(r=>r.id!==editingId);
  }

  // ✅ 正常工时校验
  let totalRegular = state.regularHours +
    dayRecords.reduce((s,r)=>s+Number(r.regularHours||0),0);

  if(state.regularHours < 0 || state.regularHours > 8)
    return "正常工时必须0~8";

  if(totalRegular > 8)
    return "当天正常工时累计超8小时";

  if(totalRegular !== 8)
    return "当天正常工时必须=8";

  // ✅ 工作日加班校验
  if(!isWeekendDay(state.weekday)){

    if(state.otWeekday < 0 || state.otWeekday > 4)
      return "加班必须0~4";

    let totalOT = state.otWeekday +
      dayRecords.reduce((s,r)=>s+Number(r.otWeekday||0),0);

    if(totalOT !== 0 && totalOT !== 4)
      return "工作日加班总和必须0或4";
  }

  return "";
}


// ✅ ✅ ✅ 修改 submitForm（支持编辑）
async function submitForm(){

  if(isSubmitting){ return }

  const err = validate();
  if(err){ showMsg(err,false); return }

  let method = "POST";
  let url = API_URL;

  if(editingId){
    if(!confirm("确认修改这条记录？")) return;
    method = "PATCH";
    url = API_URL + editingId + "/";
  }

  const payload = {
    submitTime: new Date().toISOString(),
    employeeId: empId,
    employeeName: empName,
    week: state.week,
    weekday: state.weekday,
    task: state.task,
    project: needsProject() ? state.project : "",
    unit: needsUnit() ? state.unit : "",
    regularHours: Number(state.regularHours),
    otWeekday: Number(state.otWeekday),
    otWeekend: Number(state.otWeekend),
    remark: $("remark").value || ""
  };

  try{
    isSubmitting = true;

    const res = await fetch(url,{
      method:method,
      headers:{
        "Authorization":"Token "+API_TOKEN,
        "Content-Type":"application/json"
      },
      body:JSON.stringify(payload)
    });

    if(!res.ok) throw new Error(res.status);

    editingId = null;

    showMsg("✅ 提交成功",true);

    await loadWeekRecords();

  }catch(e){
    showMsg("❌ 提交失败："+e.message,false);
  }finally{
    isSubmitting=false;
  }
}


// ✅ ✅ ✅ 删除函数
async function deleteRow(id){

  if(!confirm("确认删除这条记录？")) return;
  if(!confirm("再次确认删除！")) return;

  await fetch(API_URL + id + "/",{
    method:"DELETE",
    headers:{ "Authorization":"Token "+API_TOKEN }
  });

  showMsg("✅ 已删除",true);
  await loadWeekRecords();
}


// ✅ ✅ ✅ 编辑函数
function editRow(id){

  const r = currentWeekRecords.find(x=>x.id==id);
  if(!r) return;

  if(!confirm("确认编辑该记录？")) return;

  editingId = id;

  state.week = r.week;
  state.weekday = r.weekday;
  state.task = r.task;
  state.project = r.project;
  state.unit = r.unit;
  state.regularHours = Number(r.regularHours)||0;
  state.otWeekday = Number(r.otWeekday)||0;
  state.otWeekend = Number(r.otWeekend)||0;

  $("remark").value = r.remark||"";

  renderAllActiveChips();
  refreshDisplays();
}


// ✅ ✅ ✅ 在 renderWeekRecords 中增加操作按钮
// 找到你原来的 bodyRows += 那一段，加最后一列：

// 在行末尾增加：
bodyRows += `
<tr>
  ...
  <td>
    <button onclick="editRow(${r.id})">编辑</button>
    <button onclick="deleteRow(${r.id})">删除</button>
  </td>
</tr>`;

</script>
