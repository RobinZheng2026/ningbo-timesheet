<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工时录入系统</title>

<style>
  body {font-family: Arial, Helvetica, sans-serif; margin:10px;}
  h2 {text-align:center;}

  .wrap-top,.wrap-main,.actions,#msg,.small-note {
    max-width:605px;
    margin-left:auto;
    margin-right:auto;
  }

  table {
    border-collapse:collapse;
    table-layout:fixed;
    width:100%;
  }

  th,td {
    border:1px solid #999;
    font-size:13px;
    padding:2px;
    text-align:center;
    height:28px;
    vertical-align:middle;
    box-sizing:border-box;
  }

  th {background:#0b73b8;color:#fff;font-weight:700;}
  .top-table td {background:#e6f0fa;}
  .role-cell {background:#ffe000 !important;font-weight:700;}
  .readonly {background:#eee;}
  .sum {background:#fef3c7;font-weight:700;}

  input,select {
    width:100%;
    height:24px;
    border:none;
    outline:none;
    box-sizing:border-box;
    font-size:13px;
    margin:0;
    padding:0 4px;
    background:transparent;
  }

  input[type="number"] {text-align:center;}

  button {
    height:24px;
    min-width:24px;
    font-size:12px;
    cursor:pointer;
  }

  .btn-row {
    width:22px;
    padding:0;
  }

  .actions {
    margin-top:10px;
    display:flex;
    justify-content:center;
    gap:8px;
  }

  #msg {
    margin-top:8px;
    color:red;
    font-size:13px;
    line-height:1.4;
    min-height:20px;
    text-align:center;
  }

  .small-note {
    margin-top:4px;
    font-size:11px;
    color:#666;
    line-height:1.4;
  }
</style>
</head>
<body>

<h2>工时录入系统</h2>

<div class="wrap-top">
  <table class="top-table">
    <colgroup>
      <col style="width:50px;">
      <col style="width:50px;">
      <col style="width:50px;">
      <col style="width:50px;">
    </colgroup>
    <tr>
      <th>姓名</th>
      <th>工号</th>
      <th>岗位</th>
      <th>周数</th>
    </tr>
    <tr>
      <td id="name">--</td>
      <td id="id">--</td>
      <td id="role" class="role-cell">--</td>
      <td><input id="week" type="text"></td>
    </tr>
  </table>
</div>

<div class="wrap-main" style="margin-top:10px;">
  <table>
    <colgroup>
      <col style="width:30px;">
      <col style="width:25px;">
      <col style="width:70px;">
      <col style="width:90px;">
      <col style="width:100px;">
      <col style="width:70px;">
      <col style="width:100px;">
      <col style="width:60px;">
      <col style="width:30px;">
      <col style="width:30px;">
    </colgroup>
    <thead>
      <tr>
        <th></th>
        <th>序号</th>
        <th>工时类别</th>
        <th>项目号</th>
        <th>生产号</th>
        <th>单元号</th>
        <th>备注</th>
        <th>星期</th>
        <th style="background:#8dc63f;">正班</th>
        <th>夜加班</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
    <tfoot>
      <tr>
        <td><button class="btn-row" onclick="addRow()">+</button></td>
        <td colspan="7" style="text-align:right;">汇总</td>
        <td class="sum" id="sumR">0</td>
        <td class="sum" id="sumO">0</td>
      </tr>
    </tfoot>
  </table>
</div>

<datalist id="extraNoteList">
  <option value="项目图纸更改返工"></option>
  <option value="供应商问题返工"></option>
  <option value="内部质量问题返工"></option>
  <option value="其它返工"></option>
</datalist>

<div class="actions">
  <button onclick="save()">保存</button>
  <button onclick="submitForm()">提交</button>
</div>

<div id="msg"></div>
<div class="small-note">
  说明：先选工时类别，再选项目号；项目号会根据工时类别自动过滤。项目号确定后，再选生产号或单元号，两者会自动一一对应。额外工时备注支持下拉建议，同时仍可手动输入。

const projectMap={};
Object.entries(productionMap).forEach(([k,v])=>{
 if(!projectMap[v.project]) projectMap[v.project]=[];
 projectMap[v.project].push({prod:k,unit:v.unit});
});

const allProjects=Object.keys(projectMap);

// ✅ 工时过滤（修复）
const normalTypes=["机械组装","保温作业","电气作业","额外工时"];

function getFilteredProjects(type){
 if(normalTypes.includes(type)){
   return allProjects.filter(p=>p.startsWith("P"));
 }
 return ["其它作业","请假"].filter(p=>allProjects.includes(p));
}

// ✅ 星期（修复版）
const days=["一","二","三","四","五","六","日"];
function getToday(){
 const arr=["日","一","二","三","四","五","六"];
 return arr[new Date().getDay()];
}

// ✅ 登录
const params=new URLSearchParams(window.location.search);
const id=params.get("id");

if(!allowUsers[id]){
 document.body.innerHTML="❌ 无权限";
 throw "";
}

const info=employeeMap[id]||{};
document.getElementById("name").innerText=info.name||params.get("name");
document.getElementById("id").innerText=id;
document.getElementById("role").innerText=info.role||params.get("role");

// ✅ 主数据
let rows=[];

function addRow(){
 rows.push({
  type:"机械组装",
  project:"",
  prod:"",
  unit:"",
  day:getToday(),
  regular:"8",
  overtime:""
 });
 render();
}

function render(){
 let html="",sr=0,so=0;

 rows.forEach((r,i)=>{

 let projs=getFilteredProjects(r.type);
 let prods=(projectMap[r.project]||[]).map(x=>x.prod);
 let units=(projectMap[r.project]||[]).map(x=>x.unit);

 sr+=Number(r.regular||0);
 so+=Number(r.overtime||0);

 html+=`

<td><button onclick="rows.splice(${i},1);render()">删</button></td>
<td>${i+1}</td>

<td><select onchange="rows[${i}].type=this.value;render()">
${["机械组装","保温作业","电气作业","额外工时","其它工作"]

</select></td>

render()">
<option></option>
${prods.map(p=>`<option ${p==r.prod?"selected":""}>${p}</option>`)}
</select></td>

</select></td>

${days.map(d=>`<option ${d==r.day?"selected":""}>${d}</option>`)}
</select></td>

<td><input value="${r.overtime}"></td>

</tr>`;
