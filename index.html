<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>车间工时填报系统</title>
  <style>
    :root{
      --brand:#0078d4;
      --brand-dark:#005ea6;
      --ok:#1f8f4c;
      --bg:#f4f6f8;
      --card:#ffffff;
      --text:#1f2937;
      --sub:#6b7280;
      --warn:#b45309;
      --danger:#b91c1c;
      --border:#d1d5db;
      --shadow:0 6px 18px rgba(0,0,0,.08);
      --radius:16px;
    }

    * { box-sizing: border-box; }

    body{
      margin:0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #eef5fb 0%, var(--bg) 100%);
      color:var(--text);
    }

    .header{
      background: var(--brand);
      color:#fff;
      text-align:center;
      padding:16px 12px;
      font-size:22px;
      font-weight:700;
      letter-spacing:.5px;
      box-shadow:0 2px 8px rgba(0,0,0,.1);
    }

    .wrap{
      max-width: 520px;
      margin: 28px auto;
      padding: 0 16px 24px;
    }

    .card{
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px 18px;
      border:1px solid rgba(0,0,0,.04);
    }

    .status{
      display:flex;
      align-items:flex-start;
      gap:12px;
      margin-bottom:18px;
      padding:14px;
      border-radius:14px;
      background:#f8fbff;
      border:1px solid #dbeafe;
    }

    .status-icon{
      flex:0 0 36px;
      width:36px;
      height:36px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:18px;
      background:#e0f2fe;
      color:#0369a1;
      font-weight:700;
    }

    .status-text{
      line-height:1.6;
      font-size:16px;
    }

    .status-text .title{
      font-weight:700;
      margin-bottom:4px;
      font-size:17px;
    }

    .employee-box{
      margin: 8px 0 20px;
      padding:16px;
      border:1px solid var(--border);
      border-radius:14px;
      background:#fcfcfd;
    }

    .employee-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:8px 0;
      border-bottom:1px dashed #e5e7eb;
    }

    .employee-row:last-child{
      border-bottom:none;
    }

    .label{
      color:var(--sub);
      font-size:14px;
    }

    .value{
      font-size:18px;
      font-weight:700;
      word-break:break-all;
      text-align:right;
    }

    .value.ok{
      color:var(--ok);
    }

    .value.warn{
      color:var(--warn);
    }

    .notice{
      font-size:14px;
      color:var(--sub);
      line-height:1.7;
      margin-top:12px;
      background:#fafafa;
      border:1px solid #ececec;
      border-radius:12px;
      padding:12px 14px;
    }

    .btn-area{
      margin-top:20px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .btn{
      width:100%;
      border:none;
      border-radius:14px;
      padding:18px 16px;
      font-size:20px;
      font-weight:700;
      cursor:pointer;
      transition: all .15s ease;
    }

    .btn:active{
      transform: scale(.99);
    }

    .btn-primary{
      background: var(--brand);
      color:#fff;
      box-shadow:0 8px 18px rgba(0,120,212,.20);
    }

    .btn-primary:hover{
      background: var(--brand-dark);
    }

    .btn-primary:disabled{
      background:#9ca3af;
      box-shadow:none;
      cursor:not-allowed;
    }

    .btn-secondary{
      background:#fff;
      color:var(--brand);
      border:1px solid #bfdbfe;
      font-size:16px;
      padding:14px 16px;
    }

    .tips{
      margin-top:22px;
      text-align:center;
      color:var(--sub);
      font-size:13px;
      line-height:1.8;
    }

    .foot{
      margin-top:18px;
      text-align:center;
      color:#9ca3af;
      font-size:12px;
    }

    .hidden{
      display:none !important;
    }
  </style>
</head>
<body>

  <div class="header">车间工时填报系统</div>

  <div class="wrap">
    <div class="card">

      <div class="status">
        <div class="status-icon">✓</div>
        <div class="status-text">
          <div class="title">身份识别</div>
          <div id="statusMsg">正在识别员工二维码信息...</div>
        </div>
      </div>

      <div class="employee-box">
        <div class="employee-row">
          <div class="label">员工姓名</div>
          <div id="empName" class="value">--</div>
        </div>
        <div class="employee-row">
          <div class="label">员工工号</div>
          <div id="empId" class="value">--</div>
        </div>
        <div class="employee-row">
          <div class="label">识别状态</div>
          <div id="empState" class="value warn">待识别</div>
        </div>
      </div>

      <div class="notice">
        说明：请使用员工专属二维码扫码进入。点击下方按钮后将进入工时填写表单。<br>
        当前页面会先确认员工身份，避免扫错二维码。
      </div>

      <div class="btn-area">
        <button id="fillBtn" class="btn btn-primary" onclick="openForm()" disabled>
          点击填写工时
        </button>

        <button class="btn btn-secondary" onclick="copyCurrentInfo()">
          复制当前员工信息
        </button>
      </div>

      <div class="tips">
        扫码进入，每日填写<br>
        如提示“未识别”，请联系管理员检查二维码或员工名单
      </div>

      <div class="foot">
        Pentair Ningbo Workshop Timesheet
      </div>
    </div>
  </div>

  <script>
    /***********************
     * 1) 请只改这里 1 处
     ***********************/
    const FORMS_BASE_URL = "https://forms.office.com/r/BRJkqhawRM";

    /***********************
     * 2) 员工名单（按你最新名单）
     ***********************/
    const employeeMap = {
      "1237794":"郑",
      "1177215":"官辉",
      "1177235":"王家伟",
      "1177264":"李剑锋",
      "1177265":"李建军",
      "1177266":"李念亭",
      "1177310":"师海芳",
      "1177333":"黄维昆",
      "1177336":"席新永",
      "1177338":"叶峰",
      "1177339":"虞志胜",
      "1177342":"庄允吉",
      "1235746":"丁允志",
      "1236416":"张道仅",
      "1239728":"郭振宗",
      "1254596":"候海晴",
      "1259740":"汪保平",
      "1262912":"向波",

      "900001":"林泽学",
      "900002":"堂自赠",
      "900003":"刘建希",
      "900004":"邓翼阳",
      "900005":"邓茂胜",
      "900006":"宋冠楠",
      "900007":"曹珪",
      "900008":"侯自峰",
      "900009":"刘晨光",
      "900010":"肖永登",
      "900011":"唐先发",
      "900012":"肖渔"
    };

    /***********************
     * 3) 工具函数
     ***********************/
    function getParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    function safeText(v) {
      return v == null || v === "" ? "--" : String(v);
    }

    function $(id){
      return document.getElementById(id);
    }

    /***********************
     * 4) 页面初始化
     ***********************/
    const empId = getParam("id");
    const empName = empId ? employeeMap[empId] : "";

    function initPage(){
      $("empId").innerText = safeText(empId);
      $("empName").innerText = safeText(empName);

      if (!empId) {
        $("statusMsg").innerHTML = "未检测到工号参数，请使用员工专属二维码扫码进入。";
        $("empState").innerText = "未识别";
        $("empState").className = "value warn";
        $("fillBtn").disabled = true;
        return;
      }

      if (empName) {
        $("statusMsg").innerHTML = "已识别员工身份，请确认姓名与工号无误后点击下方按钮继续。";
        $("empState").innerText = "识别成功";
        $("empState").className = "value ok";
        $("fillBtn").disabled = false;
      } else {
        $("statusMsg").innerHTML = "工号已读取，但未在员工名单中识别到对应姓名，请勿继续填写。";
        $("empState").innerText = "未在名单中";
        $("empState").className = "value warn";
        $("fillBtn").disabled = true;
      }
    }

    /***********************
     * 5) 按钮：跳转 Forms（带上当前 id）
     *    注意：
     *    - 这里会把 id 作为URL参数继续带过去
     *    - 但 Forms 本身不会自动填字段
     *    - 你现有方案里，EmployeeID 仍建议保留为表单字段
     *      并由员工填写或后续Flow校验
     ***********************/
    function openForm() {
      if (!empId || !empName) {
        alert("未识别到有效员工信息，请使用员工专属二维码扫码。");
        return;
      }

      if (!FORMS_BASE_URL || FORMS_BASE_URL.indexOf("你的最终可访问表单ID") > -1) {
        alert("请先把代码里的 FORMS_BASE_URL 替换成你最终可访问的 Forms 短链接。");
        return;
      }

      // 带上 id 参数，后续如果你要在 Forms / Flow 侧做扩展，还能继续利用
