<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>车间工时填报系统</title>
  <style>
    :root {
      --brand: #0078d4;
      --brand-dark: #005ea6;
      --ok: #16833b;
      --danger: #b91c1c;
      --warn: #b45309;
      --bg: #f4f6f8;
      --line: #d1d5db;
      --chip: #eaf4ff;
      --chip-border: #b7d5fb;
      --text: #111827;
      --sub: #6b7280;
      --shadow: 0 8px 24px rgba(0, 0, 0, .08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #eef7ff, #f4f6f8);
      color: var(--text);
    }

    .header {
      background: var(--brand);
      color: white;
      text-align: center;
      padding: 14px;
      font-size: 22px;
      font-weight: 900;
    }

    .wrap {
      max-width: 980px;
      margin: 14px auto;
      padding: 0 10px 24px;
    }

    .card {
      background: white;
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 12px 10px 16px;
    }

    .sec-title {
      margin: 8px 0 10px;
      color: var(--brand);
      font-weight: 900;
      border-left: 4px solid var(--brand);
      padding-left: 8px;
    }

    .id-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .id-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fcfcfd;
      padding: 9px;
      min-height: 62px;
    }

    .id-label {
      font-size: 12px;
      color: var(--sub);
    }

    .id-value {
      font-size: 18px;
      font-weight: 900;
      word-break: break-all;
    }

    .id-value.ok { color: var(--ok); }
    .id-value.err { color: var(--danger); }
    .id-value.warn { color: var(--warn); }

    .tip {
      margin: 12px 0;
      padding: 10px 12px;
      border-radius: 12px;
      background: #f8fbff;
      border: 1px solid #dbeafe;
      color: #1f4b7a;
      font-size: 13px;
      line-height: 1.7;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-weight: 900;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .req {
      color: #d97706;
      margin-left: 4px;
    }

    .chip-grid {
      display: grid;
      gap: 6px;
    }

    .week-grid { grid-template-columns: repeat(4, 1fr); }
    .weekday-grid { grid-template-columns: repeat(7, 1fr); }
    .task-grid { grid-template-columns: repeat(4, 1fr); }
    .project-grid { grid-template-columns: repeat(6, 1fr); }
    .unit-grid { grid-template-columns: repeat(5, 1fr); }

    .chip {
      border: 1px solid var(--chip-border);
      background: var(--chip);
      color: #174b80;
      border-radius: 10px;
      padding: 8px 4px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
      word-break: break-word;
    }

    .chip.active {
      background: var(--brand);
      border-color: var(--brand);
      color: white;
      box-shadow: 0 6px 16px rgba(0, 120, 212, .22);
    }

    .chip.disabled {
      background: #f3f4f6;
      color: #9ca3af;
      border-color: #e5e7eb;
      cursor: not-allowed;
      box-shadow: none;
    }

    .hours-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .hour-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
      background: #fcfcfd;
    }

    .hour-title {
      font-weight: 900;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .count-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .count-btn {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 12px;
      background: #e8f1fb;
      color: #0f4c81;
      font-size: 24px;
      font-weight: 900;
      cursor: pointer;
      flex: 0 0 42px;
    }

    .count-btn:disabled {
      background: #f3f4f6;
      color: #aaa;
      cursor: not-allowed;
    }

    .count-value {
      flex: 1;
      text-align: center;
      font-size: 24px;
      font-weight: 900;
    }

    .quick-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .quick-btn {
      border: 1px solid #dbeafe;
      background: white;
      color: #2563eb;
      border-radius: 9px;
      padding: 5px 8px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .quick-btn:disabled {
      background: #f3f4f6;
      color: #aaa;
      cursor: not-allowed;
    }

    textarea,
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 15px;
      font-family: inherit;
    }

    textarea {
      min-height: 72px;
      resize: vertical;
    }

    .btn-area {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--brand);
      color: white;
    }

    .btn-primary:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .tokenBtns {
      display: none;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .btn-token {
      border: 1px solid #bfd7f5;
      background: #eef5ff;
      color: #1f4b7a;
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .msg {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
    }

    .msg.ok {
      display: block;
      background: #ecfdf5;
      border: 1px solid #bbf7d0;
      color: #166534;
    }

    .msg.err {
      display: block;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .table-scroll {
      overflow-x: auto;
      border: 1px solid #d7dde5;
      border-radius: 12px;
      background: white;
      margin-bottom: 12px;
    }

    table {
      border-collapse: collapse;
      min-width: 100%;
      width: max-content;
      font-size: 13px;
    }

    th,
    td {
      border: 1px solid #444;
      padding: 4px;
      text-align: center;
      min-width: 58px;
      height: 31px;
    }

    th {
      background: #f3f4f6;
    }

    .cell-left {
      text-align: left;
      font-weight: 900;
    }

    .warn-cell {
      background: red;
      color: white;
      font-weight: 900;
    }

    .record-empty {
      padding: 14px;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      text-align: center;
      color: #64748b;
      background: #f8fafc;
      font-size: 14px;
    }

    .small-btn {
      border: none;
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: 900;
      margin: 2px;
      cursor: pointer;
    }

    .edit-btn {
      background: #e0f2fe;
      color: #075985;
    }

    .delete-btn {
      background: #fee2e2;
      color: #991b1b;
    }

    .hidden {
      display: none !important;
    }

    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      z-index: 99;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 12px;
    }

    .modal {
      background: white;
      border-radius: 18px 18px 12px 12px;
      max-width: 760px;
      width: 100%;
      padding: 14px;
      max-height: 92vh;
      overflow: auto;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .foot {
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      margin-top: 16px;
    }

    @media (max-width: 560px) {
      .wrap { padding: 0 8px 18px; }
      .task-grid,
      .project-grid,
      .unit-grid { grid-template-columns: repeat(3, 1fr); }
      .hours-box { grid-template-columns: 1fr 1fr; }
      .id-row { grid-template-columns: repeat(3, 1fr); }
      .id-value { font-size: 15px; }
      .chip { font-size: 12px; min-height: 38px; }
      .tokenBtns { grid-template-columns: 1fr; }
      .modal-actions { flex-direction: row; }
      table { font-size: 11px; }
      th, td { min-width: 42px; height: 28px; padding: 2px; }
    }
  </style>
</head>
<body>
  <div class="header">车间工时填报系统</div>

  <div class="wrap">
    <div class="card">
      <div class="sec-title">身份确认</div>
      <div class="id-row">
        <div class="id-card">
          <div class="id-label">员工姓名</div>
          <div id="empName" class="id-value">--</div>
        </div>
        <div class="id-card">
          <div class="id-label">员工工号</div>
          <div id="empId" class="id-value">--</div>
        </div>
        <div class="id-card">
          <div class="id-label">识别状态</div>
          <div id="empState" class="id-value warn">待识别</div>
        </div>
      </div>

      <div class="tip">
        进入页面需要输入员工个人验证码；修改/删除只能操作本人记录。<br>
        工作日正常工时当天汇总不能超过 8h；工作日加班当天汇总不能超过 4h；周末加班当天汇总不能超过 8h。<br>
        工作日加班允许分多条记录提交，汇总表会提示当天最终加班是否为 0h 或 4h。
      </div>

      <div class="sec-title">本周已提交工时明细</div>
      <div id="recordList"><div class="record-empty">请选择 Week 查看本周记录</div></div>

      <div class="sec-title">填写工时</div>
      <div class="field">
        <label>Week<span class="req">*</span></label>
        <div id="weekChips" class="chip-grid week-grid"></div>
      </div>
      <div class="field">
        <label>星期<span class="req">*</span></label>
        <div id="weekdayChips" class="chip-grid weekday-grid"></div>
      </div>
      <div class="field">
        <label>工时类别<span class="req">*</span></label>
        <div id="taskChips" class="chip-grid task-grid"></div>
      </div>
      <div class="field">
        <label>项目号<span class="req">*</span></label>
        <div id="projectChips" class="chip-grid project-grid"></div>
      </div>
      <div class="field">
        <label>单元号<span class="req">*</span></label>
        <div id="unitChips" class="chip-grid unit-grid"></div>
      </div>

      <div class="hours-box">
        <div class="hour-card">
          <div class="hour-title">正常工时（小时）<span class="req">*</span></div>
          <div class="count-row">
            <button id="regularMinus" class="count-btn" onclick="changeNumber('regularHours', -0.5)">-</button>
            <div id="regularHoursDisplay" class="count-value">8</div>
            <button id="regularPlus" class="count-btn" onclick="changeNumber('regularHours', 0.5)">+</button>
          </div>
          <div id="regularHoursQuick" class="quick-row"></div>
        </div>

        <div class="hour-card" id="weekdayOTCard">
          <div class="hour-title">工作日加班（小时）</div>
          <div class="count-row">
            <button class="count-btn" onclick="changeNumber('otWeekday', -0.5)">-</button>
            <div id="otWeekdayDisplay" class="count-value">0</div>
            <button class="count-btn" onclick="changeNumber('otWeekday', 0.5)">+</button>
          </div>
          <div id="otWeekdayQuick" class="quick-row"></div>
        </div>

        <div class="hour-card hidden" id="weekendOTCard">
          <div class="hour-title">周末加班（小时）</div>
          <div class="count-row">
            <button class="count-btn" onclick="changeNumber('otWeekend', -0.5)">-</button>
            <div id="otWeekendDisplay" class="count-value">0</div>
            <button class="count-btn" onclick="changeNumber('otWeekend', 0.5)">+</button>
          </div>
          <div id="otWeekendQuick" class="quick-row"></div>
        </div>
      </div>

      <div class="field" style="margin-top:14px">
        <label>备注</label>
        <textarea id="remark" placeholder="可选"></textarea>
      </div>

      <div class="btn-area">
        <button id="submitBtn" class="btn btn-primary" onclick="submitForm()" disabled>提交工时</button>
        <div id="tokenBtns" class="tokenBtns">
          <button class="btn-token" onclick="checkTokenStatus()">检查 Token</button>
          <button class="btn-token" onclick="saveTokenToBrowser()">保存 Token</button>
          <button class="btn-token" onclick="clearTokenFromBrowser()">清除 Token</button>
          <button class="btn-token" onclick="resetEmployeeKey()">清除验证码缓存</button>
        </div>
      </div>

      <div id="msg" class="msg"></div>
      <div class="foot">Ningbo Workshop Timesheet</div>
    </div>
  </div>

  <div id="editModal" class="modal-mask hidden">
    <div class="modal">
      <div class="modal-title">修改已提交记录</div>

      <div class="field">
        <label>Week</label>
        <div id="editWeekText" class="chip disabled"></div>
      </div>

      <div class="field">
        <label>星期</label>
        <div id="editWeekdayChips" class="chip-grid weekday-grid"></div>
      </div>

      <div class="field">

      <div class="field">

        </div>

        <div class="hour-card" id="editWeekdayOTCard">

          <div class="count-row">
            <button class="count-btn" onclick="editChangeNumber('otWeekday', -0.5)">-</button>

            <button class="count-btn" onclick="editChangeNumber('otWeekday', 0.5)">+</button>
          </div>
          <div id="editOtWeekdayQuick" class="quick-row"></div>
        </div>

        <div class="hour-card hidden" id="editWeekendOTCard">
          <div class="hour-title">周末加班</div>
          <div class="count-row">
            <button class="count-btn" onclick="editChangeNumber('otWeekend', -0.5)">-</button>
            <div id="editOtWeekendDisplay" class="count-value">0</div>
            <button class="count-btn" onclick="editChangeNumber('otWeekend', 0.5)">+</button>
          </div>
          <div id="editOtWeekendQuick" class="quick-row"></div>
        </div>
      </div>

      <div class="field">
        <label>备注</label>
        <textarea id="editRemark"></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn btn-primary" onclick="saveEdit()">确认修改</button>
        <button class="btn btn-secondary" onclick="closeEditModal()">取消</button>
      </div>
    </div>
  </div>

      remark: ""
    };

    let currentWeekRecords = [];
    let isSubmitting = false;
    let editingRowId = "";
    let employeeAuthorized = false;

    const empId = getParam("id");
    const empName = empId ? employeeMap[empId] : "";

    function $(id) {
      return document.getElementById(id);
    }

    function getParam(name) {
      return new URL(location.href).searchParams.get(name);
    }

    function num(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : 0;
    }

    function safe(value) {
      return String(value ?? "").replace(/[<>&"]/g, function (s) {
        return {
          "<": "&lt;",
          ">": "&gt;",
          "&": "&amp;",
          '"': "&quot;"
        }[s];
      });
    }

    function showMsg(text, ok = true) {
      const el = $("msg");
      el.className = "msg " + (ok ? "ok" : "err");
      el.innerHTML = text;
    }

    function isWeekendDay(day) {
      return day === "六" || day === "日";
    }

    function needsProjectByTask(task) {
      return !TASKS_NO_PROJECT.includes(task || "");
    }

    function needsUnitByTask(task) {
      return !(TASKS_NO_PROJECT.includes(task || "") || TASKS_PROJECT_ONLY.includes(task || ""));
    }

    function needsProject() {
      return needsProjectByTask(state.task);
    }

    function needsUnit() {
      return needsUnitByTask(state.task);
    }

    function isPlaceholderToken(token) {
      token = String(token || "").trim();
      return !token || token === "PASTE_YOUR_BASEROW_TOKEN_HERE" || token === "请替换成你自己的Baserow Token" || token === "你的真实Token";
    }

    function getApiToken() {
      const tokenInCode = String(API_TOKEN_IN_CODE || "").trim();
      const tokenInLocal = String(localStorage.getItem(TOKEN_STORAGE_KEY) || "").trim();
      if (!isPlaceholderToken(tokenInCode)) {
        localStorage.setItem(TOKEN_STORAGE_KEY, tokenInCode);
        return tokenInCode;
      }
      return tokenInLocal || "";
    }

    function apiUrl() {
      return "https://api.baserow.io/api/database/rows/table/" + TABLE_ID + "/?user_field_names=true&size=200";
    }

    function rowUrl(id) {
      return "https://api.baserow.io/api/database/rows/table/" + TABLE_ID + "/" + id + "/?user_field_names=true";
    }

    function headers(json = true) {
      const h = { Authorization: "Token " + getApiToken() };
      if (json) h["Content-Type"] = "application/json";
      return h;
    }

    function authKeyName() {
      return "NINGBO_WORKSHOP_EMP_KEY_OK_" + String(empId || "");
    }

    function isEmployeeKeyValid(key) {
      return String(key || "").trim() === String(employeeKeyMap[empId] || "").trim() && !!employeeKeyMap[empId];
    }

    function verifyEmployeeKey() {
      if (!empId || !empName) return false;
      const savedKey = localStorage.getItem(authKeyName());
      if (savedKey && isEmployeeKeyValid(savedKey)) {
        employeeAuthorized = true;
        return true;
      }
      const input = prompt("请输入你的个人验证码：");
      if (isEmployeeKeyValid(input)) {
        employeeAuthorized = true;
        localStorage.setItem(authKeyName(), String(input).trim());
        return true;
      }
      employeeAuthorized = false;
      localStorage.removeItem(authKeyName());
      return false;
    }

    function requireAuth(alertMode = false) {
      if (employeeAuthorized) return true;
      if (verifyEmployeeKey()) return true;
      const message = "身份验证码验证失败，禁止操作。";
      if (alertMode) alert(message);
      else showMsg(message, false);
      return false;
    }

    function resetEmployeeKey() {
      if (!empId) return;
      localStorage.removeItem(authKeyName());
      employeeAuthorized = false;
      alert("已清除当前员工验证码缓存。");
    }

    function initEmployee() {
      $("empId").innerText = empId || "--";
      if (empId && empName) {
        $("empName").innerText = empName;
        if (verifyEmployeeKey()) {
          $("empState").innerText = "验证成功";
          $("empState").className = "id-value ok";
          $("submitBtn").disabled = false;
        } else {
          $("empState").innerText = "验证失败";
          $("empState").className = "id-value err";
          $("submitBtn").disabled = true;
          showMsg("身份验证码验证失败，禁止进入填写。", false);
        }
      } else if (empId) {
        $("empName").innerText = "未知员工";
        $("empState").innerText = "未在名单中";
        $("empState").className = "id-value err";
        $("submitBtn").disabled = true;
      } else {
        $("empName").innerText = "--";
        $("empState").innerText = "请扫码进入";
        $("empState").className = "id-value warn";
        $("submitBtn").disabled = true;
      }
    }

    function checkTokenStatus() {
      alert(
        "代码内 Token：" + (isPlaceholderToken(API_TOKEN_IN_CODE) ? "未填写或占位符" : "已填写") +
        "\n浏览器 Token：" + (localStorage.getItem(TOKEN_STORAGE_KEY) ? "已保存" : "未保存") +
        "\n当前状态：" + (getApiToken() ? "Token 可用" : "Token 不可用")
      );
    }

    function saveTokenToBrowser() {
      const token = prompt("请输入 Baserow Token：");
      if (!token || !token.trim()) return alert("未输入 Token。");
      if (token.trim().includes(" ")) return alert("Token 中包含空格，请检查。");
      localStorage.setItem(TOKEN_STORAGE_KEY, token.trim());
      alert("Token 已保存到当前浏览器。");
    }

    function clearTokenFromBrowser() {
      if (confirm("确认清除当前浏览器保存的 Baserow Token 吗？")) {
        localStorage.removeItem(TOKEN_STORAGE_KEY);
        alert("已清除。");
      }
    }

    function renderChips(containerId, values, field, onClick, targetState = state) {
      const box = $(containerId);
      box.innerHTML = "";
      if (!values || !values.length) {
        box.innerHTML = '<div class="chip disabled">' + (field === "unit" ? "请先选项目" : "暂无数据") + '</div>';
        return;
      }
      values.forEach(function (value) {
        const chip = document.createElement("div");
        chip.className = "chip" + (targetState[field] === value ? " active" : "");
        chip.innerText = value;
        chip.onclick = function () {
          onClick(value);
        };
        box.appendChild(chip);
      });
    }

    function disabledChip(containerId, text) {
      $(containerId).innerHTML = '<div class="chip disabled">' + text + '</div>';
    }

    function renderActive() {
      renderMainWeekChips();
      renderMainWeekdayChips();
      renderMainTaskChips();
      renderProjects();
      renderUnits();
    }

    function renderMainWeekChips() {
      renderChips("weekChips", weekOptions, "week", async function (value) {
        state.week = value;
        renderActive();
        await loadWeekRecords();
      });
    }

    function renderMainWeekdayChips() {
      renderChips("weekdayChips", weekdayOptions, "weekday", function (value) {
        state.weekday = value;
        syncHourSectionByWeekday();
        renderActive();
      });
    }

    function renderMainTaskChips() {
      renderChips("taskChips", taskOptions, "task", function (value) {
        state.task = value;
        applyTaskRules();
        renderActive();
      });
    }

    function renderProjects() {
      if (!needsProject()) {
        disabledChip("projectChips", "该类别无需项目号");
        return;
      }
      renderChips("projectChips", Object.keys(projectUnits), "project", function (value) {
        state.project = value;
        state.unit = "";
        renderUnits();
        renderActive();
      });
    }

    function renderUnits() {
      if (!needsUnit()) {
        disabledChip("unitChips", "该类别无需单元号");
        return;
      }
      const units = state.project && projectUnits[state.project] ? projectUnits[state.project] : [];
      renderChips("unitChips", units, "unit", function (value) {
        state.unit = value;
        renderActive();
      });
    }

    function applyTaskRules() {
      if (!needsProject()) {
        state.project = "";
        state.unit = "";
      } else if (!needsUnit()) {
        state.unit = "";
      }
      renderProjects();
      renderUnits();
    }

    function renderQuickButtons() {
      renderQuickRow("regularHoursQuick", "regularHours", quickHoursMap.regularHours, true, state, setNumber);
      renderQuickRow("otWeekdayQuick", "otWeekday", quickHoursMap.otWeekday, false, state, setNumber);
      renderQuickRow("otWeekendQuick", "otWeekend", quickHoursMap.otWeekend, false, state, setNumber);
    }

    function renderQuickRow(containerId, field, values, regular, obj, setter) {
      const box = $(containerId);
      box.innerHTML = "";
      values.forEach(function (value) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "quick-btn";
        btn.innerText = value === 0 ? (regular ? "0小时" : "清零") : value + "小时";
        btn.onclick = function () {
          setter(field, value);
        };
        box.appendChild(btn);
      });
    }

    function refreshDisplays() {
      $("regularHoursDisplay").innerText = state.regularHours;
      $("otWeekdayDisplay").innerText = state.otWeekday;
      $("otWeekendDisplay").innerText = state.otWeekend;
    }

    function maxHours(field) {
      if (field === "regularHours") return 8;
      if (field === "otWeekday") return 4;
      if (field === "otWeekend") return 8;
      return 8;
    }

    function changeNumber(field, delta) {
      let next = Math.round((num(state[field]) + delta) * 2) / 2;
      state[field] = Math.max(0, Math.min(next, maxHours(field)));
      refreshDisplays();
    }

    function setNumber(field, value) {
      state[field] = Math.max(0, Math.min(num(value), maxHours(field)));
      refreshDisplays();
    }

    function disableRegularInputs(disabled) {
      $("regularMinus").disabled = disabled;
      $("regularPlus").disabled = disabled;
      document.querySelectorAll("#regularHoursQuick .quick-btn").forEach(function (btn) {
        btn.disabled = disabled;
      });
    }

    function syncHourSectionByWeekday() {
      if (!state.weekday) {
        refreshDisplays();
        return;
      }
      if (isWeekendDay(state.weekday)) {
        state.regularHours = 0;
        state.otWeekday = 0;
        $("weekdayOTCard").classList.add("hidden");
        $("weekendOTCard").classList.remove("hidden");
        disableRegularInputs(true);
      } else {
        if (state.regularHours === 0) state.regularHours = 8;
        state.otWeekend = 0;
        $("weekdayOTCard").classList.remove("hidden");
        $("weekendOTCard").classList.add("hidden");
        disableRegularInputs(false);
      }
      refreshDisplays();
    }

    async function loadWeekRecords() {
      if (!state.week || !empId) {
        currentWeekRecords = [];
        renderWeekRecords([]);
        return;
      }
      if (!requireAuth(false)) {
        currentWeekRecords = [];
        renderWeekRecords([], "身份验证码验证失败，禁止读取记录。");
        return;
      }
      if (!getApiToken()) {
        renderWeekRecords([], "未检测到 Baserow Token。请联系管理员。");
        return;
      }
      try {
        const res = await fetch(apiUrl(), { headers: headers() });
        if (!res.ok) throw new Error("读取记录失败：" + res.status);
        const data = await res.json();
        let rows = Array.isArray(data) ? data : (data.results || []);
        rows = rows.filter(function (row) {
          return String(row.employeeId || "") === String(empId) && String(row.week || "") === String(state.week);
        });
        rows.sort(function (a, b) {
          return new Date(a.submitTime || 0) - new Date(b.submitTime || 0);
        });
        currentWeekRecords = rows;
        renderWeekRecords(rows);
      } catch (e) {
        currentWeekRecords = [];
        renderWeekRecords([], "本周记录读取失败：" + e.message);
      }
    }

    function renderWeekRecords(rows, err = "") {
      const box = $("recordList");
      if (err) {
        box.innerHTML = '<div class="record-empty">' + safe(err) + '</div>';
        return;
      }
      if (!state.week) {
        box.innerHTML = '<div class="record-empty">请选择 Week 查看本周记录</div>';
        return;
      }
      if (!rows.length) {
        box.innerHTML = '<div class="record-empty">当前员工在 ' + safe(state.week) + ' 还没有提交记录</div>';
        return;
      }

      const summary = {};
      weekdayOptions.forEach(function (day) {
        summary[day] = { regular: 0, overtime: 0 };
      });

      const grouped = new Map();
      let totalRegular = 0;
      let totalEveningOt = 0;
      let totalWeekendOt = 0;

      rows.forEach(function (record) {
        const key = [record.task || "", record.project || "", record.unit || "", String(record.remark || "").trim()].join("||");
        if (!grouped.has(key)) {
          const days = {};
          weekdayOptions.forEach(function (day) {
            days[day] = { regular: 0, overtime: 0 };
          });
          grouped.set(key, {
            task: record.task || "",
            project: record.project || "",
            unit: record.unit || "",
            remark: String(record.remark || "").trim(),
            days: days,
            totalRegular: 0,
            totalEveningOt: 0,
            totalWeekendOt: 0
          });
        }

        const row = grouped.get(key);
        const day = record.weekday;
        const regular = num(record.regularHours);
        const overtime = num(record.otWeekday) + num(record.otWeekend);

        if (row.days[day]) {
          row.days[day].regular += regular;
          row.days[day].overtime += overtime;
        }

        row.totalRegular += regular;
        row.totalEveningOt += num(record.otWeekday);
        row.totalWeekendOt += num(record.otWeekend);

        if (summary[day]) {
          summary[day].regular += regular;
          summary[day].overtime += overtime;
        }

        totalRegular += regular;
        totalEveningOt += num(record.otWeekday);
        totalWeekendOt += num(record.otWeekend);
      });

      const head =
        '<thead>' +
        '<tr>' +
        '<th rowspan="2">工时类别</th><th rowspan="2">项目号</th><th rowspan="2">单元号</th><th rowspan="2">备注</th>' +
        ['周一', '周二', '周三', '周四', '周五'].map(function (x) { return '<th colspan="2">' + x + '</th>'; }).join('') +
        '<th>周六</th><th>周日</th><th colspan="3">汇总</th>' +
        '</tr>' +
        '<tr>' +
        Array(5).fill('<th>正常<br>出勤</th><th>实际<br>加班</th>').join('') +
        '<th>实际<br>加班</th><th>实际<br>加班</th><th>正常<br>出勤</th><th>实际晚<br>上加班</th><th>实际周<br>末加班</th>' +
        '</tr>' +
        '</thead>';

      let body = "";
      grouped.forEach(function (row) {
        body += '<tr>' +
          '<td class="cell-left">' + safe(row.task) + '</td>' +
          '<td>' + safe(row.project) + '</td>' +
          '<td>' + safe(row.unit) + '</td>' +
          '<td>' + safe(row.remark) + '</td>' +
          ['一', '二', '三', '四', '五'].map(function (day) {
            return '<td>' + (row.days[day].regular || "") + '</td><td>' + (row.days[day].overtime || "") + '</td>';
          }).join('') +
          '<td>' + (row.days['六'].overtime || "") + '</td>' +
          '<td>' + (row.days['日'].overtime || "") + '</td>' +
          '<td>' + (row.totalRegular || "") + '</td>' +
          '<td>' + (row.totalEveningOt || "") + '</td>' +
          '<td>' + (row.totalWeekendOt || "") + '</td>' +
          '</tr>';
      });

      function warnClass(warn) {
        return warn ? ' class="warn-cell"' : '';
      }

      const sumRow = '<tr>' +
        '<td></td><td></td><td></td><td><b>汇总</b></td>' +
        ['一', '二', '三', '四', '五'].map(function (day) {
          return '<td' + warnClass(summary[day].regular !== 8) + '>' + (summary[day].regular || 0) + '</td>' +
                 '<td' + warnClass(!(summary[day].overtime === 0 || summary[day].overtime === 4)) + '>' + (summary[day].overtime || 0) + '</td>';
        }).join('') +
        '<td>' + (summary['六'].overtime || 0) + '</td>' +
        '<td>' + (summary['日'].overtime || 0) + '</td>' +
        '<td>' + (totalRegular || 0) + '</td>' +
        '<td>' + (totalEveningOt || 0) + '</td>' +
        '<td>' + (totalWeekendOt || 0) + '</td>' +
        '</tr>';

      let rawRows = "";
      rows.forEach(function (record) {
        rawRows += '<tr>' +
          '<td>' + safe(record.weekday) + '</td>' +
          '<td class="cell-left">' + safe(record.task) + '</td>' +
          '<td>' + safe(record.project) + '</td>' +
          '<td>' + safe(record.unit) + '</td>' +
          '<td>' + num(record.regularHours) + '</td>' +
          '<td>' + num(record.otWeekday) + '</td>' +
          '<td>' + num(record.otWeekend) + '</td>' +
          '<td>' + safe(record.remark || "") + '</td>' +
          '<td>' +
          '<button class="small-btn edit-btn" onclick="openEditModal(\'' + safe(record.id) + '\')">修改</button>' +
          '<button class="small-btn delete-btn" onclick="deleteRecord(\'' + safe(record.id) + '\')">删除</button>' +
          '</td>' +
          '</tr>';
      });

      box.innerHTML =
        '<div class="table-scroll"><table>' + head + '<tbody>' + body + sumRow + '</tbody></table></div>' +
        '<div class="sec-title">原始记录管理</div>' +
        '<div class="table-scroll"><table>' +
        '<thead><tr><th>星期</th><th>工时类别</th><th>项目号</th><th>单元号</th><th>正常</th><th>工作日<br>加班</th><th>周末<br>加班</th><th>备注</th><th>操作</th></tr></thead>' +
        '<tbody>' + rawRows + '</tbody>' +
        '</table></div>';
    }

    function dayTotals(week, day, excludeRowId) {
      const totals = { regular: 0, otWeekday: 0, otWeekend: 0 };
      currentWeekRecords.forEach(function (record) {
        if (String(record.id) === String(excludeRowId || "")) return;
        if (record.week !== week || record.weekday !== day) return;
        totals.regular += num(record.regularHours);
        totals.otWeekday += num(record.otWeekday);
        totals.otWeekend += num(record.otWeekend);
      });
      return totals;
    }

    function signature(payload) {
      return JSON.stringify({
        employeeId: payload.employeeId,
        week: payload.week,
        weekday: payload.weekday,
        task: payload.task,
        project: payload.project,
        unit: payload.unit,
        regularHours: num(payload.regularHours),
        otWeekday: num(payload.otWeekday),
        otWeekend: num(payload.otWeekend),
        remark: String(payload.remark || "").trim()
      });
    }

    function duplicate(signatureText, excludeRowId) {
      return currentWeekRecords.some(function (record) {
        return String(record.id) !== String(excludeRowId || "") && signature(record) === signatureText;
      });
    }

    function validatePayload(payload, excludeRowId) {
      if (!payload.employeeId || !employeeMap[payload.employeeId]) return "未识别到有效员工信息，请使用员工专属二维码扫码。";
      if (!payload.week) return "请选择 Week。";
      if (!payload.weekday) return "请选择星期。";
      if (!payload.task) return "请选择工时类别。";
      if (needsProjectByTask(payload.task) && !payload.project) return "请选择项目号。";
      if (needsUnitByTask(payload.task) && !payload.unit) return "请选择单元号。";

      const regular = num(payload.regularHours);
      const otWeekday = num(payload.otWeekday);
      const otWeekend = num(payload.otWeekend);
      const weekend = isWeekendDay(payload.weekday);

      if (regular < 0 || regular > 8) return "正常工时单条记录必须在 0~8 小时之间。";
      if (otWeekday < 0 || otWeekday > 4) return "工作日加班单条记录必须在 0~4 小时之间。";
      if (otWeekend < 0 || otWeekend > 8) return "周末加班单条记录必须在 0~8 小时之间。";

      if (weekend && (regular !== 0 || otWeekday !== 0)) return "周末不能填写正常工时或工作日加班。";
      if (!weekend && otWeekend !== 0) return "工作日不能填写周末加班。";

      const totals = dayTotals(payload.week, payload.weekday, excludeRowId);
      if (totals.regular + regular > 8) return "提交后当天正常工时汇总为 " + (totals.regular + regular) + "h，超过 8h，禁止提交。";
      if (!weekend && totals.otWeekday + otWeekday > 4) return "提交后当天工作日加班汇总为 " + (totals.otWeekday + otWeekday) + "h，超过 4h，禁止提交。";
      if (weekend && totals.otWeekend + otWeekend > 8) return "提交后当天周末加班汇总为 " + (totals.otWeekend + otWeekend) + "h，超过 8h，禁止提交。";

      if (duplicate(signature(payload), excludeRowId)) return "已存在一条完全相同的记录，无需重复提交。";
      return "";
    }

    async function submitForm() {
      if (isSubmitting) return showMsg("正在提交中，请勿重复点击。", false);
      if (!requireAuth(false)) return;
      if (!getApiToken()) return showMsg("未检测到 Baserow Token，请联系管理员。", false);

      const payload = {
        submitTime: new Date().toISOString(),
        employeeId: empId,
        employeeName: empName,
        week: state.week,
        weekday: state.weekday,
        task: state.task,
        project: needsProject() ? state.project : "",
        unit: needsUnit() ? state.unit : "",
        regularHours: num(state.regularHours),
        otWeekday: num(state.otWeekday),
        otWeekend: num(state.otWeekend),
        remark: $("remark").value || ""
      };

      const err = validatePayload(payload, "");
      if (err) return showMsg(err, false);

      try {
        isSubmitting = true;
        $("submitBtn").disabled = true;
        showMsg("正在提交，请稍候…", true);

        const res = await fetch(apiUrl(), {
          method: "POST",
          headers: headers(),
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error(res.status);

        showMsg("✅ 提交成功。", true);
        state.weekday = "";
        state.task = "";
        state.project = "";
        state.unit = "";
        state.regularHours = 8;
        state.otWeekday = 0;
        state.otWeekend = 0;
        $("remark").value = "";
        applyTaskRules();
        renderActive();
        refreshDisplays();
        syncHourSectionByWeekday();
        await loadWeekRecords();
      } catch (e) {
        showMsg("❌ 提交失败：" + e.message, false);
      } finally {
        isSubmitting = false;
        $("submitBtn").disabled = !(empId && empName && employeeAuthorized);
      }
    }

    function editRefreshDisplays() {
      $("editRegularDisplay").innerText = editState.regularHours;
      $("editOtWeekdayDisplay").innerText = editState.otWeekday;
      $("editOtWeekendDisplay").innerText = editState.otWeekend;
    }

    function editChangeNumber(field, delta) {
      let next = Math.round((num(editState[field]) + delta) * 2) / 2;
      editState[field] = Math.max(0, Math.min(next, maxHours(field)));
      editRefreshDisplays();
    }

    function editSetNumber(field, value) {
      editState[field] = Math.max(0, Math.min(num(value), maxHours(field)));
      editRefreshDisplays();
    }

    function renderEditQuickButtons() {
      renderQuickRow("editRegularQuick", "regularHours", quickHoursMap.regularHours, true, editState, editSetNumber);
      renderQuickRow("editOtWeekdayQuick", "otWeekday", quickHoursMap.otWeekday, false, editState, editSetNumber);
      renderQuickRow("editOtWeekendQuick", "otWeekend", quickHoursMap.otWeekend, false, editState, editSetNumber);
    }

    function editSyncDay() {
      if (isWeekendDay(editState.weekday)) {
        editState.regularHours = 0;
        editState.otWeekday = 0;
        $("editWeekdayOTCard").classList.add("hidden");
        $("editWeekendOTCard").classList.remove("hidden");
      } else {
        editState.otWeekend = 0;
        $("editWeekdayOTCard").classList.remove("hidden");
        $("editWeekendOTCard").classList.add("hidden");
      }
      editRefreshDisplays();
    }

    function normalizeEditState() {
      if (!needsProjectByTask(editState.task)) {
        editState.project = "";
        editState.unit = "";
        return;
      }

      if (editState.project && !projectUnits[editState.project]) {
        editState.project = "";
        editState.unit = "";
        return;
      }

      if (!needsUnitByTask(editState.task)) {
        editState.unit = "";
        return;
      }

      if (editState.project && editState.unit && !projectUnits[editState.project].includes(editState.unit)) {
        editState.unit = "";
      }
    }

    function renderEditAll() {
      normalizeEditState();
      $("editWeekText").innerText = editState.week;

      renderChips("editWeekdayChips", weekdayOptions, "weekday", function (value) {
        editState.weekday = value;
        editSyncDay();
        renderEditAll();
      }, editState);

      renderChips("editTaskChips", taskOptions, "task", function (value) {
        editState.task = value;
        if (!needsProjectByTask(value)) {
          editState.project = "";
          editState.unit = "";
        } else if (!needsUnitByTask(value)) {
          editState.unit = "";
        }
        renderEditAll();
      }, editState);

      if (!needsProjectByTask(editState.task)) {
        disabledChip("editProjectChips", "该类别无需项目号");
      } else {
        renderChips("editProjectChips", Object.keys(projectUnits), "project", function (value) {
          editState.project = value;
          editState.unit = "";
          renderEditAll();
        }, editState);
      }

      if (!needsUnitByTask(editState.task)) {
        disabledChip("editUnitChips", "该类别无需单元号");
      } else {
        const units = editState.project && projectUnits[editState.project] ? projectUnits[editState.project] : [];
        renderChips("editUnitChips", units, "unit", function (value) {
          editState.unit = value;
          renderEditAll();
        }, editState);
      }

      renderEditQuickButtons();
      editSyncDay();
    }

    function openEditModal(id) {
      if (!requireAuth(false)) return;
      const record = currentWeekRecords.find(function (x) {
        return String(x.id) === String(id);
      });
      if (!record) return showMsg("未找到要修改的记录。", false);
      if (String(record.employeeId) !== String(empId)) return showMsg("非法操作：只能修改自己的记录。", false);

      editingRowId = String(id);
      editState = {
        week: record.week || state.week,
        weekday: record.weekday || "",
        task: record.task || "",
        project: record.project || "",
        unit: record.unit || "",
        regularHours: num(record.regularHours),
        otWeekday: num(record.otWeekday),
        otWeekend: num(record.otWeekend),
        remark: record.remark || ""
      };

      // 修复重点：兼容历史数据或项目/单元已变更导致的编辑弹窗打不开/无法保存问题
      normalizeEditState();

      $("editRemark").value = editState.remark;
      renderEditAll();
      $("editModal").classList.remove("hidden");
    }

    function closeEditModal() {
      editingRowId = "";
      $("editModal").classList.add("hidden");
    }

    async function saveEdit() {
      if (!editingRowId) return alert("未找到要修改的记录。");
      if (!requireAuth(true)) return;
      const oldRecord = currentWeekRecords.find(function (x) {
        return String(x.id) === String(editingRowId);
      });
      if (oldRecord && String(oldRecord.employeeId) !== String(empId)) return alert("非法操作：只能修改自己的记录。");

      normalizeEditState();
      const weekend = isWeekendDay(editState.weekday);
      const payload = {
        employeeId: empId,
        employeeName: empName,
        week: editState.week,
        weekday: editState.weekday,
        task: editState.task,
        project: needsProjectByTask(editState.task) ? editState.project : "",
        unit: needsUnitByTask(editState.task) ? editState.unit : "",
        regularHours: weekend ? 0 : num(editState.regularHours),
        otWeekday: weekend ? 0 : num(editState.otWeekday),
        otWeekend: weekend ? num(editState.otWeekend) : 0,
        remark: $("editRemark").value || ""
      };

      const err = validatePayload(payload, editingRowId);
      if (err) return alert(err);

      if (!confirm("确认修改这条记录吗？")) return;

      try {
        const res = await fetch(rowUrl(editingRowId), {
          method: "PATCH",
          headers: headers(),
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error(res.status);
        closeEditModal();
        showMsg("✅ 修改成功。", true);
        await loadWeekRecords();
      } catch (e) {
        alert("❌ 修改失败：" + e.message);
      }
    }

    async function deleteRecord(id) {
      if (!requireAuth(false)) return;
      const record = currentWeekRecords.find(function (x) {
        return String(x.id) === String(id);
      });
      if (!record) return showMsg("未找到要删除的记录。", false);
      if (String(record.employeeId) !== String(empId)) return showMsg("非法操作：只能删除自己的记录。", false);

      if (!confirm(
        "确认删除这条记录吗？\n\n" +
        "星期：" + (record.weekday || "") + "\n" +
        "工时类别：" + (record.task || "") + "\n" +
        "项目号：" + (record.project || "") + "\n" +
        "单元号：" + (record.unit || "") + "\n" +
        "正常工时：" + num(record.regularHours) + "h\n" +
        "工作日加班：" + num(record.otWeekday) + "h\n" +
        "周末加班：" + num(record.otWeekend) + "h"
      )) return;

      if (!confirm("删除后无法在本页面恢复。请再次确认：是否永久删除？")) return;

      try {
        const res = await fetch(rowUrl(id), {
          method: "DELETE",
          headers: headers(false)
        });
        if (!res.ok) throw new Error(res.status);
        showMsg("✅ 删除成功。", true);
        await loadWeekRecords();
      } catch (e) {
        showMsg("❌ 删除失败：" + e.message, false);
      }
    }

    function init() {
      if (getParam("admin") === "1") $("tokenBtns").style.display = "grid";
      initEmployee();
      renderMainWeekChips();
      renderMainWeekdayChips();
      renderMainTaskChips();
      applyTaskRules();
      renderQuickButtons();
      refreshDisplays();
    }

    init();
  </script>
</body>
</html>
