<!-- ✅ 已精简头部，仅保留必要结构 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工时系统</title>
</head>

<body>

<h2>工时填报</h2>

<div id="info"></div>

Week:
<select id="week">
  <option value="W25">W25</option>
  <option value="W26">W26</option>
</select>

星期:
<select id="day">
  <option>一</option><option>二</option><option>三</option>
  <option>四</option><option>五</option>
  <option>六</option><option>日</option>
</select>

正常工时:
<input id="reg" value="8">

加班:
<input id="ot" value="0">

<button onclick="submitForm()">提交</button>

<h3>记录</h3>
<div id="list"></div>

<script>

const API_URL = "https://api.baserow.io/api/database/rows/table/1030254/";
const TOKEN = "你的TOKEN";

const empId = new URL(location).searchParams.get("id");

let records = [];
let editingId = null;

// ✅ 读取记录
async function load(){
  const res = await fetch(API_URL+"?user_field_names=true",{
    headers:{Authorization:"Token "+TOKEN}
  });
  const data = await res.json();
  records = (data.results||[]).filter(x=>x.employeeId==empId);
  render();
}

// ✅ 渲染
function render(){

  let html="";

  records.forEach(r=>{
    html+=`
    <div>
      ${r.weekday} | 正常:${r.regularHours} | 加班:${r.otWeekday}
      <button onclick="edit(${r.id})">编辑</button>
      <button onclick="del(${r.id})">删除</button>
    </div>`;
  });

  document.getElementById("list").innerHTML = html;
}

// ✅ 编辑
function edit(id){
  if(!confirm("确认编辑？")) return;
  const r = records.find(x=>x.id==id);

  editingId=id;

  document.getElementById("week").value=r.week;
  document.getElementById("day").value=r.weekday;
  document.getElementById("reg").value=r.regularHours;
  document.getElementById("ot").value=r.otWeekday;
}

// ✅ 删除
async function del(id){
  if(!confirm("确认删除？")) return;
  if(!confirm("再确认一次删除！")) return;

  await fetch(API_URL+id+"/",{
    method:"DELETE",
    headers:{Authorization:"Token "+TOKEN}
  });

  load();
}

// ✅ 校验核心
function validate(){

  const day = document.getElementById("day").value;
  const reg = Number(document.getElementById("reg").value);
  const ot = Number(document.getElementById("ot").value);

  let dayRecords = records.filter(r=>r.weekday==day);

  // 编辑排除自己
  if(editingId){
    dayRecords = dayRecords.filter(r=>r.id!=editingId);
  }

  let totalReg = reg + dayRecords.reduce((s,r)=>s+Number(r.regularHours),0);

  if(reg>8 || reg<0) return "单条工时必须0~8";
  if(totalReg>8) return "当天工时超过8";
  if(totalReg!=8) return "当天工时必须等于8";

  // 工作日加班
  if(day!="六" && day!="日"){
    if(ot<0 || ot>4) return "加班0~4";

    let totalOt = ot + dayRecords.reduce((s,r)=>s+Number(r.otWeekday||0),0);

    if(totalOt!=0 && totalOt!=4)
      return "加班总和必须0或4";
  }

  return "";
}

// ✅ 提交
async function submitForm(){

  const err = validate();
  if(err){ alert(err); return; }

  const payload = {
    employeeId:empId,
    week:document.getElementById("week").value,
    weekday:document.getElementById("day").value,
    regularHours:Number(document.getElementById("reg").value),
    otWeekday:Number(document.getElementById("ot").value)
  };

  let method="POST";
  let url=API_URL;

  if(editingId){
    if(!confirm("确认修改？")) return;
    method="PATCH";
    url += editingId + "/";
  }

  await fetch(url,{
    method:method,
    headers:{
      Authorization:"Token "+TOKEN,
      "Content-Type":"application/json"
    },
    body:JSON.stringify(payload)
  });

  editingId=null;
  load();
}

load();

</script>
</body>
</html>
