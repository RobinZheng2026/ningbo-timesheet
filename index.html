const projectMap = {};
Object.entries(productionMap).forEach(([k,v])=>{
  if(!projectMap[v.project]) projectMap[v.project]=[];
  projectMap[v.project].push({prod:k,unit:v.unit});
});

const projectList = Object.keys(projectMap);

// ✅ 登录校验
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

if(!allowUsers[id]){
  document.body.innerHTML = "<h2>无权限</h2>";
  throw("error");
}

const info = employeeMap[id] || {};
document.getElementById("name").innerText = info.name || params.get("name");
document.getElementById("id").innerText = id;
document.getElementById("role").innerText = info.role || params.get("role");

// ✅ 数据
let rows=[];

function addRow(){
 rows.push({project:"",prod:"",unit:"",day:"星期一",regular:"8",overtime:""});
 render();
}

function setProject(i,v){
 rows[i].project=v;
 rows[i].prod="";
 rows[i].unit="";
 render();
}

function setProd(i,v){
 rows[i].prod=v;
 rows[i].unit = productionMap[v]?.unit || "";
 render();
}

function setUnit(i,v){
 rows[i].unit=v;
 let list = projectMap[rows[i].project]||[];
 let found = list.find(x=>x.unit==v);
 rows[i].prod = found?found.prod:"";
 render();
}

 let tb="";
 let sumR=0,sumO=0;

 rows.forEach((r,i)=>{
  let prodList = (projectMap[r.project]||[]).map(x=>x.prod);
  let unitList = (projectMap[r.project]||[]).map(x=>x.unit);

  sumR+=Number(r.regular||0);
  sumO+=Number(r.overtime||0);

  tb+=`

<td><button onclick="rows.splice(${i},1);render()">删</button></td>
<td>${i+1}</td>

<td>
<select>
<option>机械组装</option>
<option>保温作业</option>
<option>电气作业</option>
<option>车间管理</option>
<option>额外工时</option>
</select>
</td>

<td>
<select onchange="setProject(${i},this.value)">

${projectList.map(p=>`<option ${p==r.project?'selected':''}>${p}</option>`)}
</select>
</td>

<td>
<select onchange="setProd(${i},this.value)">
<option></option>
${prodList.map(p=>`<option ${p==r.prod?'selected':''}>${p}</option>`)}
</select>
</td>

<td>
<select onchange="setUnit(${i},this.value)">

</select>
</td>

<option>星期一</option>
<option>星期二</option>
<option>星期三</option>
<option>星期四</option>
<option>星期五</option>
<option>星期六</option>
<option>星期日</option>
</select>
</td>

<td><input value="${r.regular}"></td>
<td><input value="${r.overtime}"></td>

</tr>`;
