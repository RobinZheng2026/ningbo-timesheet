<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>车间工时填报系统</title>

<style>

body {
  margin: 0;
  font-family: "Microsoft YaHei", Arial;
  background: #f4f6f8;
}

.header {
  background: #0078d4;
  color: white;
  text-align: center;
  padding: 16px;
  font-size: 20px;
  font-weight: bold;
}

.container {
  text-align: center;
  margin-top: 40px;
}

.card {
  background: white;
  margin: 20px;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.big {
  font-size: 18px;
  margin: 10px 0;
}

.name {
  font-size: 22px;
  font-weight: bold;
  color: #0078d4;
}

.id {
  font-size: 18px;
  color: #333;
}

.status-ok {
  color: green;
  font-weight: bold;
}

.status-error {
  color: red;
  font-weight: bold;
}

button {
  margin-top: 20px;
  padding: 18px 40px;
  font-size: 20px;
  background: #0078d4;
  color: white;
  border: none;
  border-radius: 10px;
}

button:disabled {
  background: #999;
}

.tip {
  margin-top: 20px;
  color: #666;
  font-size: 14px;
}

</style>

</head>

<body>

<div class="header">
  车间工时填报系统
</div>

<div class="container">

  <div class="card">

    <div id="status">正在识别员工...</div>

    <div class="big name" id="name">--</div>
    <div class="big id" id="empId">--</div>

    <button id="btn" onclick="goForm()" disabled>
      点击填写工时
    </button>

    <div class="tip">
      扫码进入后点击填写
    </div>

  </div>

</div>


<script>

// ✅ 你的员工名单
const employeeMap = {
  "1237794":"郑",
  "1177215":"官辉",
  "1177235":"王家伟",
  "1177264":"李剑锋",
  "1177265":"李建军",
  "1177266":"李念亭",
  "1177310":"师海芳",
  "1177333":"黄维昆",
  "1177336":"席新永",
  "1177338":"叶峰",
  "1177339":"虞志胜",
  "1177342":"庄允吉",
  "1235746":"丁允志",
  "1236416":"张道仅",
  "1239728":"郭振宗",
  "1254596":"候海晴",
  "1259740":"汪保平",
  "1262912":"向波",

  "900001":"林泽学",
  "900002":"堂自赠",
  "900003":"刘建希",
  "900004":"邓翼阳",
  "900005":"邓茂胜",
  "900006":"宋冠楠",
  "900007":"曹珪",
  "900008":"侯自峰",
  "900009":"刘晨光",
  "900010":"肖永登",
  "900011":"唐先发",
  "900012":"肖渔"
};

// ✅ 读取URL参数
function getParam(name) {
  const url = new URL(window.location.href);
  return url.searchParams.get(name);
}

// ✅ 获取ID
const empIdParam = getParam("id");

const nameEl = document.getElementById("name");
const idEl = document.getElementById("empId");
const statusEl = document.getElementById("status");
const btn = document.getElementById("btn");

if (empIdParam && employeeMap[empIdParam]) {

  nameEl.innerText = employeeMap[empIdParam];
  idEl.innerText = "工号：" + empIdParam;

  statusEl.innerHTML = "<span class='status-ok'>✅ 已识别员工</span>";

  btn.disabled = false;

} else if (empIdParam) {

  nameEl.innerText = "未知员工";
  idEl.innerText = "工号：" + empIdParam;

  statusEl.innerHTML = "<span class='status-error'>❌ 未在名单中</span>";

  btn.disabled = true;

} else {

  nameEl.innerText = "--";
  idEl.innerText = "--";

  statusEl.innerHTML = "<span class='status-error'>请扫码进入</span>";

  btn.disabled = true;
}


// ✅ 跳转Forms（已替换你给的URL）
function goForm() {
  
  const base = "https://forms.office.com/r/BRJkqhawRM";

  // ✅ 不再带参数！！！
  window.location.href = base;
}

</script>

</body>
</html>
