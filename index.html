<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>车间工时填报</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
}

.header {
  background: #0078d4;
  color: white;
  text-align: center;
  padding: 16px;
  font-size: 20px;
  font-weight: bold;
}

.container {
  text-align: center;
  margin-top: 60px;
}

.user-box {
  margin: 30px auto;
  padding: 15px;
  width: 80%;
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  font-size: 18px;
}

button {
  padding: 20px 40px;
  font-size: 20px;
  background: #28a745;
  color: white;
  border: none;
  border-radius: 12px;
}

.tip {
  margin-top: 30px;
  color: #666;
}

</style>

</head>

<body>

<div class="header">
  车间工时填报系统
</div>

<div class="container">

  <div id="userInfo" class="user-box">
    正在识别员工...
  </div>

  <button onclick="openForm()">点击填写工时</button>

  <div class="tip">
    扫码进入，每日填写
  </div>

</div>

<script>

// ✅ 员工映射（你这份名单全部写进来了）
const employeeMap = {
  "1237794":"郑",
  "1177215":"官辉",
  "1177235":"王家伟",
  "1177264":"李剑锋",
  "1177265":"李建军",
  "1177266":"李念亭",
  "1177310":"师海芳",
  "1177333":"黄维昆",
  "1177336":"席新永",
  "1177338":"叶峰",
  "1177339":"虞志胜",
  "1177342":"庄允吉",
  "1235746":"丁允志",
  "1236416":"张道仅",
  "1239728":"郭振宗",
  "1254596":"候海晴",
  "1259740":"汪保平",
  "1262912":"向波",

  "900001":"林泽学",
  "900002":"堂自赠",
  "900003":"刘建希",
  "900004":"邓翼阳",
  "900005":"邓茂胜",
  "900006":"宋冠楠",
  "900007":"曹珪",
  "900008":"侯自峰",
  "900009":"刘晨光",
  "900010":"肖永登",
  "900011":"唐先发",
  "900012":"肖渔"
};

// ✅ 读取URL参数
function getParam(name) {
  const url = new URL(window.location.href);
  return url.searchParams.get(name);
}

const empId = getParam("id");

const infoEl = document.getElementById("userInfo");

// ✅ 页面识别员工
if (empId && employeeMap[empId]) {
  infoEl.innerHTML = "员工：" + employeeMap[empId] + "<br>工号：" + empId;
} else if (empId) {
  infoEl.innerHTML = "工号：" + empId + "（未识别，请联系管理员）";
} else {
  infoEl.innerHTML = "请使用员工二维码扫码";
}

// ✅ 跳转 Forms（带ID）
function openForm() {
  const baseUrl = "https://forms.office.com/r/BRJkqhawRM"; // 🔴替换
  const finalUrl = baseUrl + "?id=" + encodeURIComponent(empId || "");
  window.location.href = finalUrl;
}

</script>

</body>
</html>
