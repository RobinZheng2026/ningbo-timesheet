function getTodayCN(){const arr=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];return arr[new Date().getDay()];}
function getWeek(){const d=new Date();const onejan=new Date(d.getFullYear(),0,1);return Math.ceil((((d-onejan)/86400000)+onejan.getDay()+1)/7);}
document.getElementById("week").value=getWeek();
const list=Object.keys(productionMap);
let rows=[];
function addRow(){rows.push({type:"机械组装",prod:"",project:"",unit:"",note:"",day:getTodayCN(),regular:"8",overtime:""});render();}
function delRow(i){rows.splice(i,1);if(rows.length===0) addRow(); else render();}
function setVal(i,k,v){rows[i][k]=v;render();}
function setProd(i,v){rows[i].prod=v;rows[i].project=productionMap[v]?.project||"";rows[i].unit=productionMap[v]?.unit||"";render();}
function render(){let tb=document.getElementById("tbody");tb.innerHTML="";let sumR=0,sumO=0;rows.forEach((r,i)=>{sumR+=Number(r.regular||0);sumO+=Number(r.overtime||0);tb.innerHTML+=`<tr><td><button onclick="delRow(${i})">删</button></td><td>${i+1}</td><td><select onchange="setVal(${i},'type',this.value)">${types.map(t=>`<option ${t==r.type?'selected':''}>${t}</option>`).join('')}</select></td><td><select onchange="setProd(${i},this.value)"><option></option>${list.map(p=>`<option ${p==r.prod?'selected':''}>${p}</option>`).join('')}</select></td><td class="readonly">${r.project}</td><td class="readonly">${r.unit}</td><td>${r.type=="额外工时"?`<select onchange="setVal(${i},'note',this.value)">${notes.map(n=>`<option ${n==r.note?'selected':''}>${n}</option>`).join('')}</select>`:`<input value="${r.note||''}" onchange="setVal(${i},'note',this.value)">`}</td><td><select onchange="setVal(${i},'day',this.value)">${days.map(d=>`<option ${d==r.day?'selected':''}>${d}</option>`).join('')}</select></td><td><input type="number" value="${r.regular}" onchange="setVal(${i},'regular',this.value)"></td><td><input type="number" value="${r.overtime}" onchange="setVal(${i},'overtime',this.value)"></td></tr>`;});document.getElementById("sumR").innerText=sumR;document.getElementById("sumO").innerText=sumO;}
function save(){localStorage.setItem("data_"+id,JSON.stringify(rows));msg("已保存");}
function submitForm(){let err=[];let total={};days.forEach(d=>total[d]=0);rows.forEach((r,i)=>{if(!r.prod) err.push(`第${i+1}行未选生产号`);if(r.regular===''||isNaN(Number(r.regular))) err.push(`第${i+1}行正班错误`);if(r.overtime!==''&&isNaN(Number(r.overtime))) err.push(`第${i+1}行加班错误`);total[r.day]+=Number(r.regular||0);if(Number(r.overtime||0)>8) err.push(`第${i+1}行加班异常`);});["星期一","星期二","星期三","星期四","星期五"].forEach(d=>{if(total[d]!==0&&total[d]!==8) err.push(`${d}正班必须=8`);});if(err.length){msg(err.join("<br>"));return;} msg("提交成功");}
function msg(t){document.getElementById("msg").innerHTML=t;}
try{const saved=JSON.parse(localStorage.getItem("data_"+id)||'null');if(saved&&Array.isArray(saved)&&saved.length) rows=saved;}catch(e){}
