<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工时录入系统</title>

<style>
body {font-family: Arial; margin: 10px;}
h2 {text-align:center;}

.wrap-top,.wrap-main {max-width:605px;margin:auto;}

table {border-collapse: collapse; table-layout: fixed; width:100%;}
th,td {border:1px solid #999;font-size:13px;padding:2px;text-align:center;height:28px;}
th{background:#0b73b8;color:#fff;}
.role-cell{background:#ffe000;font-weight:bold;}
.sum{background:#fef3c7;font-weight:bold;}

input,select{width:100%;height:24px;border:none;font-size:13px;}

</style>
</head>

<body>

<h2>工时录入系统</h2>

<div class="wrap-top">
<table>
<tr><th>姓名</th><th>工号</th><th>岗位</th><th>周数</th></tr>
<tr>
<td id="name"></td>
<td id="id"></td>
<td id="role" class="role-cell"></td>
<td><input id="week"></td>
</tr>
</table>
</div>

<br>

<div class="wrap-main">
<table>

<colgroup>
<col style="width:30px">
<col style="width:25px">
<col style="width:70px">
<col style="width:90px">
<col style="width:100px">
<col style="width:70px">
<col style="width:100px">
<col style="width:60px">
<col style="width:30px">
<col style="width:30px">
</colgroup>

<thead>
<tr>
<th></th>
<th>序号</th>
<th>工时类别</th>
<th>项目号</th>
<th>生产号</th>
<th>单元号</th>
<th>备注</th>
<th>星期</th>
<th style="background:#8dc63f;">正班</th>
<th>夜加班</th>
</tr>
</thead>

<tbody id="tbody"></tbody>

<tfoot>
<tr>
<td><button onclick="addRow()">+</button></td>
<td colspan="7" style="text-align:right">汇总</td>
<td id="sumR">0</td>
<td id="sumO">0</td>
</tr>
</tfoot>

</table>
</div>

<br>

<div style="text-align:center">
<button onclick="save()">保存</button>
<button onclick="submitForm()">提交</button>
</div>

<div id="msg"></div>

<script>

// ✅ 白名单
const allowUsers={"X1":true,"E2":true,"I1":true,"F1":true};

// ✅ 员工
const employeeMap={
"X1":{name:"郑",role:"经理"},
"E2":{name:"官辉",role:"电工"},
"I1":{name:"王家伟",role:"保温工"},
"F1":{name:"丁允志",role:"主管"}
};

// ✅ 项目
const productionMap={
"OTHER-01":{project:"其它作业",unit:"早会"},
"LEAVE-01":{project:"请假",unit:"年假"},

"0401":{project:"P0407",unit:"U123"},
"0402":{project:"P0407",unit:"U335"}
};

// ✅ 自动生成
const projectMap={};
Object.entries(productionMap).forEach(([k,v])=>{
 if(!projectMap[v.project]) projectMap[v.project]=[];
 projectMap[v.project].push({prod:k,unit:v.unit});
});

const allProjects=Object.keys(projectMap);

// ✅ 工时类别逻辑（重点✅）
const normalTypes=["机械组装","保温作业","电气作业","额外工时"];

function getFilteredProjects(type){

// ✅ 正常工时 → 只显示P项目
if(normalTypes.includes(type)){
 return allProjects.filter(p=>p.startsWith("P"));
}

// ✅ 其它工作 → 只显示其它/请假
return allProjects.filter(p=>p==="其它作业"||p==="请假");
}

// ✅ 登录
const params=new URLSearchParams(window.location.search);
const id=params.get("id");

if(!allowUsers[id]){
 document.body.innerHTML="❌ 无权限";
 throw "";
}

const info=employeeMap[id]||{};
document.getElementById("name").innerText=info.name||params.get("name");
document.getElementById("id").innerText=id;
document.getElementById("role").innerText=info.role||params.get("role");

// ✅ 数据
let rows=[];

function addRow(){
 rows.push({type:"机械组装",project:"",prod:"",unit:"",day:"星期一",regular:"8",overtime:""});
 render();
}

function setType(i,v){
 rows[i].type=v;
 rows[i].project="";
 rows[i].prod="";
 rows[i].unit="";
 render();
}

function setProject(i,v){
 rows[i].project=v;
 rows[i].prod="";
 rows[i].unit="";
 render();
}

function setProd(i,v){
 rows[i].prod=v;
 rows[i].unit=productionMap[v]?.unit||"";
 render();
}

function setUnit(i,v){
 rows[i].unit=v;
 let list=projectMap[rows[i].project]||[];
 let f=list.find(x=>x.unit==v);
 rows[i].prod=f?f.prod:"";
 render();
}

// ✅ 渲染
function render(){

let html="";
let sumR=0,sumO=0;

rows.forEach((r,i)=>{

let projs=getFilteredProjects(r.type);
let prods=(projectMap[r.project]||[]).map(x=>x.prod);
let units=(projectMap[r.project]||[]).map(x=>x.unit);

sumR+=Number(r.regular||0);
sumO+=Number(r.overtime||0);

html+=`
<tr>
<td><button onclick="rows.splice(${i},1);render()">删</button></td>
<td>${i+1}</td>

<td>
<select onchange="setType(${i},this.value)">
<option ${r.type=="机械组装"?"selected":""}>机械组装</option>
<option ${r.type=="保温作业"?"selected":""}>保温作业</option>
<option ${r.type=="电气作业"?"selected":""}>电气作业</option>
<option ${r.type=="额外工时"?"selected":""}>额外工时</option>
<option ${r.type=="其它工作"?"selected":""}>其它工作</option>
</select>
</td>

<td>
<select onchange="setProject(${i},this.value)">
<option></option>
${projs.map(p=>`<option ${p==r.project?"selected":""}>${p}</option>`).join("")}
</select>
</td>

<td>
<select onchange="setProd(${i},this.value)">
<option></option>
${prods.map(p=>`<option ${p==r.prod?"selected":""}>${p}</option>`).join("")}
</select>
</td>

<td>
<select onchange="setUnit(${i},this.value)">
<option></option>
${units.map(u=>`<option ${u==r.unit?"selected":""}>${u}</option>`).join("")}
</select>
</td>

<td><input></td>

<td>
<select>
<option>星期一</option>
<option>星期二</option>
<option>星期三</option>
<option>星期四</option>
<option>星期五</option>
<option>星期六</option>
<option>星期日</option>
</select>
</td>

<td><input value="${r.regular}"></td>
<td><input value="${r.overtime}"></td>

</tr>`;
});

document.getElementById("tbody").innerHTML=html;
document.getElementById("sumR").innerText=sumR;
document.getElementById("sumO").innerText=sumO;

}

// ✅ 提交校验
function submitForm(){
 let err=[];
 rows.forEach((r,i)=>{
  if(!r.project) err.push(`第${i+1}行未选项目`);
 });
 document.getElementById("msg").innerHTML=err.join("<br>")||"提交成功";
}

// ✅ 保存
function save(){
 localStorage.setItem("data",JSON.stringify(rows));
 alert("已保存");
}

// 启动
addRow();

</script>

</body>
</html>
