<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工时录入系统</title>

<style>
body {font-family: Arial; margin: 10px;}
table {border-collapse: collapse; width: 100%; max-width: 550px; margin: auto;}
th,td {border: 1px solid #999; font-size: 13px; padding: 2px; text-align: center; height: 28px;}
th {background: #0b73b8; color: #fff;}
.sum {background: #fef3c7; font-weight: bold;}
.readonly {background: #eee;}
input,select {width: 100%; height: 24px; border: none; font-size: 13px;}
button {height: 24px;}
.role {background:#ffe000}
</style>
</head>

<body>

<h2 style="text-align:center;">工时录入系统</h2>

<table style="max-width:550px;margin:auto;">
<tr><th>姓名</th><th>工号</th><th>岗位</th><th>周数</th></tr>
<tr>
<td id="name"></td>
<td id="id"></td>
<td id="role" class="role"></td>
<td><input id="week"></td>
</tr>
</table>

<br>

<table>
<thead>
    <tr>
      <th style="width:25px"></th>
      <th style="width:25px">序号</th>
      <th style="width:70px">工时类别</th>
      <th style="width:70px">项目号</th>
      <th style="width:100px">生产号</th>
      <th style="width:50px">单元号</th>
      <th style="width:100px">备注</th>
      <th style="width:50px">星期</th>
      <th style="width:30px; background:#8dc63f;">正班</th>
      <th style="width:30px">夜加班</th>
    </tr>

</thead>
<tbody id="tbody"></tbody>
<tfoot>
<tr>
<td><button onclick="addRow()">+</button></td>
<td colspan="7" style="text-align:right">汇总</td>
<td id="sumR">0</td>
<td id="sumO">0</td>
</tr>
</tfoot>
</table>

<div id="msg"></div>

<script>

// ✅ 白名单
const allowUsers = {
"A":true,"X1":true,"E2":true,"I1":true,"L1":true,"W3":true,"E1":true,"W1":true,"I2":true
};

// ✅ 员工信息
const employeeMap = {
"F1":{name:"丁允志",role:"主管"},
"E2":{name:"官辉",role:"电工"},
"I1":{name:"王家伟",role:"保温工"}
};

// ✅ 项目配置（你以后只改这里）
const productionMap = {
"0351706-02-27":{project:"P0351706",unit:"U451"},
"0351706-02-26":{project:"P0351706",unit:"U381"},
"88031":{project:"其他工作",unit:""}
};

// ✅ 自动生成 project → prod/unit
const projectMap = {};
Object.entries(productionMap).forEach(([k,v])=>{
  if(!projectMap[v.project]) projectMap[v.project]=[];
  projectMap[v.project].push({prod:k,unit:v.unit});
});

const projectList = Object.keys(projectMap);

// ✅ 登录校验
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

if(!allowUsers[id]){
  document.body.innerHTML = "<h2>无权限</h2>";
  throw("error");
}

const info = employeeMap[id] || {};
document.getElementById("name").innerText = info.name || params.get("name");
document.getElementById("id").innerText = id;
document.getElementById("role").innerText = info.role || params.get("role");

// ✅ 数据
let rows=[];

function addRow(){
 rows.push({project:"",prod:"",unit:"",day:"星期一",regular:"8",overtime:""});
 render();
}

function setProject(i,v){
 rows[i].project=v;
 rows[i].prod="";
 rows[i].unit="";
 render();
}

function setProd(i,v){
 rows[i].prod=v;
 rows[i].unit = productionMap[v]?.unit || "";
 render();
}

function setUnit(i,v){
 rows[i].unit=v;
 let list = projectMap[rows[i].project]||[];
 let found = list.find(x=>x.unit==v);
 rows[i].prod = found?found.prod:"";
 render();
}

function render(){
 let tb="";
 let sumR=0,sumO=0;

 rows.forEach((r,i)=>{
  let prodList = (projectMap[r.project]||[]).map(x=>x.prod);
  let unitList = (projectMap[r.project]||[]).map(x=>x.unit);

  sumR+=Number(r.regular||0);
  sumO+=Number(r.overtime||0);

  tb+=`
<tr>
<td><button onclick="rows.splice(${i},1);render()">删</button></td>
<td>${i+1}</td>

<td>
<select>
<option>机械组装</option>
<option>保温作业</option>
<option>电气作业</option>
<option>车间管理</option>
<option>额外工时</option>
</select>
</td>

<td>
<select onchange="setProject(${i},this.value)">
<option></option>
${projectList.map(p=>`<option ${p==r.project?'selected':''}>${p}</option>`)}
</select>
</td>

<td>
<select onchange="setProd(${i},this.value)">
<option></option>
${prodList.map(p=>`<option ${p==r.prod?'selected':''}>${p}</option>`)}
</select>
</td>

<td>
<select onchange="setUnit(${i},this.value)">
<option></option>
${unitList.map(u=>`<option ${u==r.unit?'selected':''}>${u}</option>`)}
</select>
</td>

<td><input></td>

<td>
<select>
<option>星期一</option>
<option>星期二</option>
<option>星期三</option>
<option>星期四</option>
<option>星期五</option>
<option>星期六</option>
<option>星期日</option>
</select>
</td>

<td><input value="${r.regular}"></td>
<td><input value="${r.overtime}"></td>

</tr>`;
 });

 document.getElementById("tbody").innerHTML=tb;
 document.getElementById("sumR").innerText=sumR;
 document.getElementById("sumO").innerText=sumO;
}

addRow();

</script>

</body>
</html>
