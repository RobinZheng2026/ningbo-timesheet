<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>车间工时填报系统</title>
  <style>
    :root{
      --brand:#0078d4;
      --brand-dark:#005ea6;
      --ok:#1f8f4c;
      --warn:#b45309;
      --danger:#b91c1c;
      --bg:#f4f6f8;
      --card:#ffffff;
      --text:#1f2937;
      --sub:#6b7280;
      --border:#d1d5db;
      --shadow:0 6px 18px rgba(0,0,0,.08);
      --radius:16px;
      --chip:#eef5ff;
      --chip-border:#bfd7f5;
      --chip-active:#0078d4;
      --chip-text:#1f4b7a;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #eef5fb 0%, var(--bg) 100%);
      color:var(--text);
    }

    .header{
      background: var(--brand);
      color:#fff;
      text-align:center;
      padding:16px 12px;
      font-size:22px;
      font-weight:700;
      letter-spacing:.5px;
      box-shadow:0 2px 8px rgba(0,0,0,.1);
    }

    .wrap{
      max-width: 760px;
      margin: 16px auto;
      padding: 0 12px 28px;
    }

    .card{
      background:#fff;
      border-radius:18px;
      box-shadow: var(--shadow);
      padding:14px 12px 18px;
      border:1px solid rgba(0,0,0,.04);
    }

    .sec-title{
      margin: 6px 0 10px;
      font-size: 16px;
      font-weight: 800;
      color: var(--brand);
      border-left: 4px solid var(--brand);
      padding-left: 8px;
    }

    .id-row{
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap:10px;
      margin-top:8px;
    }

    .id-card{
      border:1px solid var(--border);
      border-radius:14px;
      background:#fcfcfd;
      padding:10px 12px;
      min-height:72px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:6px;
    }

    .id-label{
      font-size:13px;
      color:var(--sub);
    }

    .id-value{
      font-size:20px;
      font-weight:800;
      color:#111827;
      word-break:break-all;
      line-height:1.2;
    }

    .id-value.ok{ color:var(--ok); }
    .id-value.warn{ color:var(--warn); }
    .id-value.err{ color:var(--danger); }

    .tip{
      margin: 12px 0 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background:#f8fbff;
      border:1px solid #dbeafe;
      color:#1f4b7a;
      font-size:14px;
      line-height:1.7;
    }

    .field{
      margin-bottom: 14px;
    }

    .field label{
      display:block;
      font-size:14px;
      font-weight:700;
      margin-bottom:6px;
      color:#374151;
    }

    .field .req{
      color:#d97706;
      margin-left:4px;
    }

    select, textarea{
      width:100%;
      padding:12px 12px;
      border:1px solid var(--border);
      border-radius:12px;
      font-size:16px;
      background:#fff;
      color:#111827;
      outline:none;
    }

    select:focus, textarea:focus{
      border-color:#93c5fd;
      box-shadow:0 0 0 3px rgba(59,130,246,.15);
    }

    textarea{
      min-height:86px;
      resize:vertical;
    }

    .chip-grid{
      display:grid;
      gap:8px;
    }

    /* Week 一行4个 */
    .week-grid{
      grid-template-columns: repeat(4, 1fr);
    }

    /* 星期一行7个 */
    .weekday-grid{
      grid-template-columns: repeat(7, 1fr);
    }

    /* 工时类别：桌面一行5个，窄屏自动缩 */
    .task-grid{
      grid-template-columns: repeat(5, 1fr);
    }

    .chip{
      border:1px solid var(--chip-border);
      background:var(--chip);
      color:var(--chip-text);
      border-radius:12px;
      padding:10px 6px;
      text-align:center;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
      user-select:none;
      transition:.15s ease;
      min-height:48px;
      display:flex;
      align-items:center;
      justify-content:center;
      line-height:1.2;
    }

    .chip:active{ transform:scale(.98); }

    .chip.active{
      background:var(--chip-active);
      color:#fff;
      border-color:var(--chip-active);
      box-shadow:0 6px 16px rgba(0,120,212,.22);
    }

    .hours-box{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
    }

    .hour-card{
      border:1px solid var(--border);
      border-radius:14px;
      padding:12px;
      background:#fcfcfd;
    }

    .hour-title{
      font-size:14px;
      font-weight:700;
      margin-bottom:8px;
      color:#374151;
    }

    .count-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .count-btn{
      width:44px;
      height:44px;
      border:none;
      border-radius:12px;
      background:#e8f1fb;
      color:#0f4c81;
      font-size:24px;
      font-weight:700;
      cursor:pointer;
      flex:0 0 44px;
    }

    .count-value{
      flex:1;
      text-align:center;
      font-size:24px;
      font-weight:800;
      color:#111827;
    }

    .quick-row{
      display:flex;
      gap:8px;
      margin-top:8px;
      flex-wrap:wrap;
    }

    .quick-btn{
      border:1px solid #dbeafe;
      background:#fff;
      color:#2563eb;
      border-radius:10px;
      padding:6px 10px;
      font-size:13px;
      font-weight:700;
      cursor:pointer;
    }

    .btn-area{
      margin-top:20px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .btn{
      width:100%;
      border:none;
      border-radius:14px;
      padding:16px 16px;
      font-size:18px;
      font-weight:800;
      cursor:pointer;
      transition:.15s ease;
    }

    .btn:active{ transform:scale(.99); }

    .btn-primary{
      background: var(--brand);
      color:#fff;
      box-shadow:0 8px 18px rgba(0,120,212,.20);
    }

    .btn-primary:hover{ background: var(--brand-dark); }

    .btn-primary:disabled{
      background:#9ca3af;
      box-shadow:none;
      cursor:not-allowed;
    }

    .msg{
      margin-top:14px;
      padding:12px 14px;
      border-radius:12px;
      font-size:14px;
      line-height:1.6;
      display:none;
    }

    .msg.ok{
      display:block;
      background:#ecfdf5;
      border:1px solid #bbf7d0;
      color:#166534;
    }

    .msg.err{
      display:block;
      background:#fef2f2;
      border:1px solid #fecaca;
      color:#991b1b;
    }

    .records-wrap{
      margin-top: 18px;
      border-top: 1px solid #e5e7eb;
      padding-top: 14px;
    }

    .record-tip{
      font-size: 13px;
      color: var(--sub);
      margin-bottom: 10px;
    }

    .record-list{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .record-item{
      border:1px solid var(--border);
      border-radius:14px;
      padding:10px 12px;
      background:#fcfcfd;
    }

    .record-top{
      display:flex;
      justify-content:space-between;
      gap:8px;
      margin-bottom:6px;
      font-size:14px;
      font-weight:700;
    }

    .record-main{
      font-size:14px;
      line-height:1.7;
      color:#374151;
    }

    .record-empty{
      padding:14px;
      border:1px dashed #cbd5e1;
      border-radius:12px;
      text-align:center;
      color:#64748b;
      background:#f8fafc;
      font-size:14px;
    }

    .foot{
      margin-top:16px;
      text-align:center;
      color:#9ca3af;
      font-size:12px;
    }

    @media (max-width: 680px){
      .task-grid{
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 560px){
      .id-row{
        grid-template-columns: 1fr;
      }
      .week-grid{
        grid-template-columns: repeat(2, 1fr);
      }
      .weekday-grid{
        grid-template-columns: repeat(4, 1fr);
      }
      .task-grid{
        grid-template-columns: repeat(2, 1fr);
      }
      .hours-box{
        grid-template-columns:1fr;
      }
      .id-value{
        font-size:18px;
      }
    }
  </style>
</head>
<body>
  <div class="header">车间工时填报系统</div>

  <div class="wrap">
    <div class="card">

      <div class="sec-title">身份确认</div>
      <div class="id-row">
        <div class="id-card">
          <div class="id-label">员工姓名</div>
          <div id="empName" class="id-value">--</div>
        </div>
        <div class="id-card">
          <div class="id-label">员工工号</div>
          <div id="empId" class="id-value">--</div>
        </div>
        <div class="id-card">
          <div class="id-label">识别状态</div>
          <div id="empState" class="id-value warn">待识别</div>
        </div>
      </div>

      <div class="tip">
        请选择本周、星期、工时类别、项目、单元并填写工时。<br>
        正常工时默认 8 小时，如有加班直接点加号即可。<br>
        允许一天内提交多次，但会自动拦截“完全重复的一条记录”。
      </div>

      <div class="sec-title">填写工时</div>

      <!-- Week -->
      <div class="field">
        <label>Week<span class="req">*</span></label>
        <div class="chip-grid week-grid" id="weekChips"></div>
      </div>

      <!-- weekday -->
      <div class="field">
        <label>星期<span class="req">*</span></label>
        <div class="chip-grid weekday-grid" id="weekdayChips"></div>
      </div>

      <!-- task -->
      <div class="field">
        <label>工时类别<span class="req">*</span></label>
        <div class="chip-grid task-grid" id="taskChips"></div>
      </div>

      <!-- project -->
      <div class="field">
        <label for="project">项目号<span class="req">*</span></label>
        <select id="project">
          <option value="">请选择项目号</option>
        </select>
      </div>

      <!-- unit -->
      <div class="field">
        <label for="unit">单元号<span class="req">*</span></label>
        <select id="unit">
          <option value="">请先选择项目号</option>
        </select>
      </div>

      <!-- hours -->
      <div class="hours-box">
        <div class="hour-card">
          <div class="hour-title">正常工时（小时）<span class="req">*</span></div>
          <div class="count-row">
            <button class="count-btn" type="button" onclick="changeNumber('regularHours', -0.5)">-</button>
            <div class="count-value" id="regularHoursDisplay">8</div>
            <button class="count-btn" type="button" onclick="changeNumber('regularHours', 0.5)">+</button>
          </div>
          <div class="quick-row">
            <button class="quick-btn" type="button" onclick="setNumber('regularHours', 8)">8小时</button>
            <button class="quick-btn" type="button" onclick="setNumber('regularHours', 4)">4小时</button>
            <button class="quick-btn" type="button" onclick="setNumber('regularHours', 0)">0小时</button>
          </div>
        </div>

        <div class="hour-card">
          <div class="hour-title">工作日加班（小时）</div>
          <div class="count-row">
            <button class="count-btn" type="button" onclick="changeNumber('otWeekday', -0.5)">-</button>
            <div class="count-value" id="otWeekdayDisplay">0</div>
            <button class="count-btn" type="button" onclick="changeNumber('otWeekday', 0.5)">+</button>
          </div>
          <div class="quick-row">
            <button class="quick-btn" type="button" onclick="setNumber('otWeekday', 0)">清零</button>
            <button class="quick-btn" type="button" onclick="setNumber('otWeekday', 2)">2小时</button>
            <button class="quick-btn" type="button" onclick="setNumber('otWeekday', 4)">4小时</button>
          </div>
        </div>
      </div>

      <div class="hour-card" style="margin-top:12px;">
        <div class="hour-title">周末加班（小时）</div>
        <div class="count-row">
          <button class="count-btn" type="button" onclick="changeNumber('otWeekend', -0.5)">-</button>
          <div class="count-value" id="otWeekendDisplay">0</div>
          <button class="count-btn" type="button" onclick="changeNumber('otWeekend', 0.5)">+</button>
        </div>
        <div class="quick-row">
          <button class="quick-btn" type="button" onclick="setNumber('otWeekend', 0)">清零</button>
          <button class="quick-btn" type="button" onclick="setNumber('otWeekend', 4)">4小时</button>
          <button class="quick-btn" type="button" onclick="setNumber('otWeekend', 8)">8小时</button>
        </div>
      </div>

      <div class="field" style="margin-top:14px;">
        <label for="remark">备注</label>
        <textarea id="remark" placeholder="可选"></textarea>
      </div>

      <div class="btn-area">
        <button id="submitBtn" class="btn btn-primary" onclick="submitForm()" disabled>提交工时</button>
      </div>

      <div id="msg" class="msg"></div>

      <div class="records-wrap">
        <div class="sec-title">本周已提交记录</div>
        <div class="record-tip">选择 Week 后会自动显示当前员工本周已经提交的数据，方便查漏补缺。</div>
        <div id="recordList" class="record-list">
          <div class="record-empty">请选择 Week 查看本周记录</div>
        </div>
      </div>

      <div class="foot">Ningbo Workshop Timesheet</div>
    </div>
  </div>

  <script>
    /***********************
     * 1) API 配置
     * ⚠️ 建议你后面把 token 换一个新的
     ***********************/
    const API_URL = "https://api.baserow.io/api/database/rows/table/1030254/?user_field_names=true";
    const API_TOKEN = "vHwFROkQHYBYJck1Lv4i6kqitbbJI8e1";

    /***********************
     * 2) 白名单员工映射
     ***********************/
    const employeeMap = {
      "1237794":"郑",
      "1177215":"官辉",
      "1177235":"王家伟",
      "1177264":"李剑锋",
      "1177265":"李建军",

      "1177336":"席新永",

      "1239728":"郭振宗",
      "1254596":"候海晴",
      "1259740":"汪保平",
      "1262912":"向波",
      "900001":"林泽学",
      "900002":"堂自赠",
      "900003":"刘建希",
      "900004":"邓翼阳",
      "900005":"邓茂胜",
      "900006":"宋冠楠",
      "900007":"曹珪",
      "900008":"侯自峰",
      "900009":"刘晨光",
      "900010":"肖永登",
      "900011":"唐先发",
      "900012":"肖渔"
    };

    /***********************
     * 3) 项目与单元映射
     ***********************/
    const projectUnits = {
      "P0407596": [
        "U123","U123-1","U335","U343","U361","U368","U368-1","U368-3",
        "U371","U373","U381","U382","U387","U451","U503",
        "U641A","U641A-1","U641B","U641B-1","U641C","U641C-1"
      ],
      "P0407596_v": ["536165"],
      "P0382530": [
        "U114-1","U125","U201A","U201B","U344","U361","U381","U401","P0335-DH2000A"
      ],
      "P0382530_V": ["102821","105076","503842","532971","129822"],
      "P0373305": [
        "U121","U123","U123-1","U142","U335","U342","U361","U368","U368-1",
        "U368-3","U381","U387","U503","U611","U611-A","U611-B","U611-C","U611-D"
      ],
      "P88359": ["U201-2","U335","U341","U361","U371","U381","U451"],
      "P88359_V": ["536165"],
      "P0384374": [
        "U120","U126","U126-1","U335","U343","U361","U368","U368-1",
        "U368-3","U371","U373","U381","U387","U451","U641A","U641B","U641C","U641D"
      ],
      "P0384374_V": ["536474"]
    };

    /***********************
     * 4) 固定选项
     ***********************/
    const weekOptions = ["W25","W26","W27","W28"];
    const weekdayOptions = ["一","二","三","四","五","六","日"];
    const taskOptions = [
      "机械组装","保温作业","电气安装","收发料","物流发货",
      "仓库帮忙","车间管理","其它工作","额外工时","请假"
    ];

    /***********************
     * 5) 页面状态
     ***********************/
    const state = {
      week: "",
      weekday: "",
      task: "",
      regularHours: 8,
      otWeekday: 0,
      otWeekend: 0
    };

    let isSubmitting = false;
    let currentWeekRecords = [];

    function $(id){ return document.getElementById(id); }

    function getParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    function showMsg(text, ok = true){
      const el = $("msg");
      el.className = "msg " + (ok ? "ok" : "err");
      el.innerHTML = text;
    }

    function safe(v){
      return String(v ?? "").replace(/[<>&"]/g, s => ({
        "<":"&lt;",
        ">":"&gt;",
        "&":"&amp;",
        "\"":"&quot;"
      }[s]));
    }

    function formatTime(v){
      if(!v) return "--";
      try{
        const d = new Date(v);
        if(isNaN(d.getTime())) return v;
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2,"0");
        const day = String(d.getDate()).padStart(2,"0");
        const hh = String(d.getHours()).padStart(2,"0");
        const mm = String(d.getMinutes()).padStart(2,"0");
        return `${y}-${m}-${day} ${hh}:${mm}`;
      }catch{
        return v;
      }
    }

    function renderChips(containerId, values, fieldName){
      const container = $(containerId);
      container.innerHTML = "";
      values.forEach(v => {
        const chip = document.createElement("div");
        chip.className = "chip";
        chip.innerText = v;
        chip.dataset.value = v;
        chip.dataset.field = fieldName;
        chip.onclick = async () => {
          state[fieldName] = v;
          renderAllActiveChips();
          if (fieldName === "week") {
            await loadWeekRecords();
          }
        };
        container.appendChild(chip);
      });
    }

    function renderAllActiveChips(){
      document.querySelectorAll(".chip").forEach(chip => {
        const field = chip.dataset.field;
        const value = chip.dataset.value;
        chip.classList.toggle("active", state[field] === value);
      });
    }

    function fillProjects(){
      const projectSelect = $("project");
      projectSelect.innerHTML = '<option value="">请选择项目号</option>';
      Object.keys(projectUnits).forEach(p => {
        const opt = document.createElement("option");
        opt.value = p;
        opt.textContent = p;
        projectSelect.appendChild(opt);
      });
    }

    function fillUnits(project){
      const unitSelect = $("unit");
      unitSelect.innerHTML = "";

      const first = document.createElement("option");
      first.value = "";
      first.textContent = project ? "请选择单元号" : "请先选择项目号";
      unitSelect.appendChild(first);

      if(!project || !projectUnits[project]) return;

      projectUnits[project].forEach(u => {
        const opt = document.createElement("option");
        opt.value = u;
        opt.textContent = u;
        unitSelect.appendChild(opt);
      });
    }

    function refreshDisplays(){
      $("regularHoursDisplay").innerText = state.regularHours;
      $("otWeekdayDisplay").innerText = state.otWeekday;
      $("otWeekendDisplay").innerText = state.otWeekend;
    }

    function changeNumber(field, delta){
      const now = Number(state[field] || 0);
      let next = Math.round((now + delta) * 2) / 2;
      if(next < 0) next = 0;
      if(next > 12) next = 12;
      state[field] = next;
      refreshDisplays();
    }

    function setNumber(field, value){
      state[field] = value;
      refreshDisplays();
    }

    /***********************
     * 6) 白名单身份识别
     ***********************/
    const empId = getParam("id");
    const empName = empId ? employeeMap[empId] : "";

    function initEmployee(){
      $("empId").innerText = empId || "--";

      if (empId && empName) {
        $("empName").innerText = empName;
        $("empState").innerText = "识别成功";
        $("empState").className = "id-value ok";
        $("submitBtn").disabled = false;
      } else if (empId) {
        $("empName").innerText = "未知员工";
        $("empState").innerText = "未在名单中";
        $("empState").className = "id-value err";
        $("submitBtn").disabled = true;
      } else {
        $("empName").innerText = "--";
        $("empState").innerText = "请扫码进入";
        $("empState").className = "id-value warn";
        $("submitBtn").disabled = true;
      }
    }

    /***********************
     * 7) 读取本周记录
     ***********************/
    async function loadWeekRecords(){
      if(!state.week || !empId){
        renderWeekRecords([]);
        return;
      }

      try {
        const res = await fetch(API_URL, {
          method: "GET",
          headers: {
            "Authorization": "Token " + API_TOKEN,
            "Content-Type": "application/json"
          }
        });

        if(!res.ok){
          throw new Error("读取记录失败：" + res.status);
        }

        const data = await res.json();
        let rows = [];

        if (Array.isArray(data)) {
          rows = data;
        } else if (Array.isArray(data.results)) {
          rows = data.results;
        }

        rows = rows.filter(r =>
          String(r.employeeId || "") === String(empId) &&
          String(r.week || "") === String(state.week)
        );

        rows.sort((a, b) => {
          const ta = new Date(a.submitTime || 0).getTime();
          const tb = new Date(b.submitTime || 0).getTime();
          return tb - ta;
        });

        currentWeekRecords = rows;
        renderWeekRecords(rows);

      } catch(e){
        renderWeekRecords([], "本周记录读取失败：" + e.message);
      }
    }

    function renderWeekRecords(rows, errMsg = ""){
      const box = $("recordList");
      box.innerHTML = "";

      if(errMsg){
        box.innerHTML = `<div class="record-empty">${safe(errMsg)}</div>`;
        return;
      }

      if(!state.week){
        box.innerHTML = `<div class="record-empty">请选择 Week 查看本周记录</div>`;
        return;
      }

      if(!rows || rows.length === 0){
        box.innerHTML = `<div class="record-empty">当前员工在 ${safe(state.week)} 还没有提交记录</div>`;
        return;
      }

      rows.forEach(r => {
        const item = document.createElement("div");
        item.className = "record-item";
        item.innerHTML = `
          <div class="record-top">
            <div>${safe(r.week || "")} · 星期${safe(r.weekday || "")}</div>
            <div>${safe(formatTime(r.submitTime))}</div>
          </div>
          <div class="record-main">
            ${safe(r.task || "")} ｜ ${safe(r.project || "")} ｜ ${safe(r.unit || "")}<br>
            正常工时：${Number(r.regularHours || 0)} ｜ 工作日加班：${Number(r.otWeekday || 0)} ｜ 周末加班：${Number(r.otWeekend || 0)}
            ${r.remark ? `<br>备注：${safe(r.remark)}` : ""}
          </div>
        `;
        box.appendChild(item);
      });
    }

    /***********************
     * 8) 防重复提交（允许每天多次）
     *    只阻止：完全相同的一条记录再次提交
     ***********************/
    function buildSubmitSignature(payload){
      return JSON.stringify({
        employeeId: payload.employeeId,
        week: payload.week,
        weekday: payload.weekday,
        task: payload.task,
        project: payload.project,
        unit: payload.unit,
        regularHours: Number(payload.regularHours),
        otWeekday: Number(payload.otWeekday),
        otWeekend: Number(payload.otWeekend),
        remark: String(payload.remark || "").trim()
      });
    }

    function existsExactDuplicate(signature){
      return currentWeekRecords.some(r => {
        const sig = JSON.stringify({
          employeeId: r.employeeId,
          week: r.week,
          weekday: r.weekday,
          task: r.task,
          project: r.project,
          unit: r.unit,
          regularHours: Number(r.regularHours || 0),
          otWeekday: Number(r.otWeekday || 0),
          otWeekend: Number(r.otWeekend || 0),
          remark: String(r.remark || "").trim()
        });
        return sig === signature;
      });
    }

    function isFastRepeat(signature){
      const key = "last_submit_signature";
      const timeKey = "last_submit_time";
      const prevSig = localStorage.getItem(key);
      const prevTs = Number(localStorage.getItem(timeKey) || 0);
      const now = Date.now();

      if(prevSig === signature && (now - prevTs) < 15000){
        return true;
      }
      return false;
    }

    function saveLastSubmit(signature){
      localStorage.setItem("last_submit_signature", signature);
      localStorage.setItem("last_submit_time", String(Date.now()));
    }

    /***********************
     * 9) 校验
     ***********************/
    function validate(){
      if(!empId || !empName){
        return "未识别到有效员工信息，请使用员工专属二维码扫码。";
      }
      if(!state.week) return "请选择 Week。";
      if(!state.weekday) return "请选择星期。";
      if(!state.task) return "请选择工时类别。";
      if(!$("project").value) return "请选择项目号。";
      if(!$("unit").value) return "请选择单元号。";

      if (state.regularHours < 0 || state.regularHours > 12) return "正常工时必须在 0~12 之间。";
      if (state.otWeekday < 0 || state.otWeekday > 12) return "工作日加班必须在 0~12 之间。";
      if (state.otWeekend < 0 || state.otWeekend > 12) return "周末加班必须在 0~12 之间。";

      return "";
    }

    /***********************
     * 10) 提交
     ***********************/
    async function submitForm(){
      if(isSubmitting){
        showMsg("正在提交中，请勿重复点击。", false);
        return;
      }

      const err = validate();
      if (err){
        showMsg(err, false);
        return;
      }

      if (!API_TOKEN || API_TOKEN.includes("请替换成你自己的Baserow Token")) {
        showMsg("请先把代码里的 API_TOKEN 替换成你自己的 Baserow token。", false);
        return;
      }

      const payload = {
        submitTime: new Date().toISOString(),
        employeeId: empId,
        employeeName: empName,
        week: state.week,
        weekday: state.weekday,
        task: state.task,
        project: $("project").value,
        unit: $("unit").value,
        regularHours: Number(state.regularHours),
        otWeekday: Number(state.otWeekday),
        otWeekend: Number(state.otWeekend),
        remark: $("remark").value || ""
      };

      const signature = buildSubmitSignature(payload);

      if (isFastRepeat(signature)) {
        showMsg("请勿连续重复提交完全相同的数据。", false);
        return;
      }

      if (existsExactDuplicate(signature)) {
        showMsg("本周已存在一条完全相同的记录，无需重复提交。", false);
        return;
      }

      try {
        isSubmitting = true;
        $("submitBtn").disabled = true;
        showMsg("正在提交，请稍候…", true);

        const res = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Authorization": "Token " + API_TOKEN,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          throw new Error("接口返回失败状态：" + res.status);
        }

        saveLastSubmit(signature);
        showMsg("✅ 提交成功。", true);

        // 清空本次填写，但保留身份
        state.weekday = "";
        state.task = "";
        state.regularHours = 8;
        state.otWeekday = 0;
        state.otWeekend = 0;

        renderAllActiveChips();
        refreshDisplays();

        $("project").value = "";
        fillUnits("");
        $("remark").value = "";

        // 重新读取本周记录
        await loadWeekRecords();

      } catch (e) {
        showMsg("❌ 提交失败：" + e.message, false);
      } finally {
        isSubmitting = false;
        $("submitBtn").disabled = !(empId && empName);
      }
    }

    /***********************
     * 11) 初始化
     ***********************/
    function init(){
      initEmployee();

      renderChips("weekChips", weekOptions, "week");
      renderChips("weekdayChips", weekdayOptions, "weekday");
      renderChips("taskChips", taskOptions, "task");
      renderAllActiveChips();

      fillProjects();
      $("project").addEventListener("change", function(){
        fillUnits(this.value);
      });

      refreshDisplays();
      renderWeekRecords([]);
    }

    init();
  </script>
</body>
