<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>车间工时填报系统</title>
  <style>
    :root{
      --brand:#0078d4;
      --brand-dark:#005ea6;
      --ok:#1f8f4c;
      --warn:#b45309;
      --danger:#b91c1c;
      --bg:#f4f6f8;
      --card:#ffffff;
      --text:#1f2937;
      --sub:#6b7280;
      --border:#d1d5db;
      --shadow:0 6px 18px rgba(0,0,0,.08);
      --chip:#eef5ff;
      --chip-border:#bfd7f5;
      --chip-active:#0078d4;
      --chip-text:#1f4b7a;
      --soft-panel:#f3f4f6;
      --soft-panel-border:#cfd6de;
      --summary-bg:#f8fbff;
      --summary-border:#cfe5fb;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #eef5fb 0%, var(--bg) 100%);
      color:var(--text);
    }

    .header{
      background: var(--brand);
      color:#fff;
      text-align:center;
      padding:14px 12px;
      font-size:22px;
      font-weight:700;
      letter-spacing:.5px;
      box-shadow:0 2px 8px rgba(0,0,0,.1);
    }

    .wrap{
      max-width:760px;
      margin:14px auto;
      padding:0 10px 24px;
    }

    .card{
      background:#fff;
      border-radius:18px;
      box-shadow: var(--shadow);
      padding:12px 10px 16px;
      border:1px solid rgba(0,0,0,.04);
    }

    .sec-title{
      margin:6px 0 10px;
      font-size:16px;
      font-weight:800;
      color:var(--brand);
      border-left:4px solid var(--brand);
      padding-left:8px;
    }

    .id-row{
      display:grid;
      grid-template-columns:repeat(3, minmax(0,1fr));
      gap:8px;
      margin-top:8px;
    }

    .id-card{
      border:1px solid var(--border);
      border-radius:12px;
      background:#fcfcfd;
      padding:8px 10px;
      min-height:68px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:4px;
      min-width:0;
    }
    .id-label{ font-size:12px; color:var(--sub); }
    .id-value{
      font-size:19px;
      font-weight:800;
      color:#111827;
      word-break:break-all;
      line-height:1.15;
    }
    .id-value.ok{ color:var(--ok); }
    .id-value.warn{ color:var(--warn); }
    .id-value.err{ color:var(--danger); }

    .tip{
      margin:12px 0 14px;
      padding:10px 12px;
      border-radius:12px;
      background:#f8fbff;
      border:1px solid #dbeafe;
      color:#1f4b7a;
      font-size:13px;
      line-height:1.65;
    }

    .field{ margin-bottom:12px; }
    .field label{
      display:block;
      font-size:14px;
      font-weight:700;
      margin-bottom:6px;
      color:#374151;
    }
    .field .req{ color:#d97706; margin-left:4px; }

    textarea{
      width:100%;
      padding:10px 12px;
      border:1px solid var(--border);
      border-radius:12px;
      font-size:15px;
      background:#fff;
      color:#111827;
      outline:none;
      min-height:84px;
      resize:vertical;
    }
    textarea:focus{
      border-color:#93c5fd;
      box-shadow:0 0 0 3px rgba(59,130,246,.15);
    }

    .chip-grid{ display:grid; gap:6px; }
    .week-grid{ grid-template-columns: repeat(4, 1fr); }
    .weekday-grid{ grid-template-columns: repeat(7, 1fr); }
    .task-grid{ grid-template-columns: repeat(5, 1fr); }
    .project-grid{ grid-template-columns: repeat(6, 1fr); }
    .unit-grid{ grid-template-columns: repeat(5, 1fr); }

    .chip{
      border:1px solid var(--chip-border);
      background:var(--chip);
      color:var(--chip-text);
      border-radius:10px;
      padding:8px 5px;
      text-align:center;
      font-size:14px;
      font-weight:700;
      cursor:pointer;
      user-select:none;
      transition:.15s ease;
      min-height:42px;
      display:flex;
      align-items:center;
      justify-content:center;
      line-height:1.15;
      word-break:break-word;
    }
    .chip:active{ transform:scale(.98); }
    .chip.active{
      background:var(--chip-active);
      color:#fff;
      border-color:var(--chip-active);
      box-shadow:0 6px 16px rgba(0,120,212,.22);
    }
    .chip.disabled{
      background:#f3f4f6;
      color:#9ca3af;
      border-color:#e5e7eb;
      cursor:not-allowed;
      box-shadow:none;
    }

    .hours-box{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    .hour-card{
      border:1px solid var(--border);
      border-radius:14px;
      padding:10px;
      background:#fcfcfd;
    }
    .hour-title{
      font-size:14px;
      font-weight:700;
      margin-bottom:8px;
      color:#374151;
    }
    .count-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .count-btn{
      width:42px;
      height:42px;
      border:none;
      border-radius:12px;
      background:#e8f1fb;
      color:#0f4c81;
      font-size:24px;
      font-weight:700;
      cursor:pointer;
      flex:0 0 42px;
    }
    .count-value{
      flex:1;
      text-align:center;
      font-size:24px;
      font-weight:800;
      color:#111827;
    }
    .quick-row{
      display:flex;
      gap:6px;
      margin-top:8px;
      flex-wrap:wrap;
    }
    .quick-btn{
      border:1px solid #dbeafe;
      background:#fff;
      color:#2563eb;
      border-radius:9px;
      padding:5px 8px;
      font-size:12px;
      font-weight:700;
      cursor:pointer;
      min-width:41px;
    }

    .hidden{ display:none !important; }

    .btn-area{
      margin-top:18px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .btn{
      width:100%;
      border:none;
      border-radius:14px;
      padding:15px 16px;
      font-size:18px;
      font-weight:800;
      cursor:pointer;
      transition:.15s ease;
    }
    .btn:active{ transform:scale(.99); }
    .btn-primary{
      background:var(--brand);
      color:#fff;
      box-shadow:0 8px 18px rgba(0,120,212,.20);
    }
    .btn-primary:hover{ background: var(--brand-dark); }
    .btn-primary:disabled{ background:#9ca3af; box-shadow:none; cursor:not-allowed; }

    .msg{
      margin-top:14px;
      padding:12px 14px;
      border-radius:12px;
      font-size:14px;
      line-height:1.6;
      display:none;
    }
    .msg.ok{ display:block; background:#ecfdf5; border:1px solid #bbf7d0; color:#166534; }
    .msg.err{ display:block; background:#fef2f2; border:1px solid #fecaca; color:#991b1b; }

    .records-wrap{
      margin-top:18px;
      border-top:1px solid #e5e7eb;
      padding-top:14px;
    }
    .record-tip{ font-size:13px; color:var(--sub); margin-bottom:10px; }
    .record-list{ display:flex; flex-direction:column; gap:12px; }

    .record-day{
      border:1px solid var(--soft-panel-border);
      border-radius:14px;
      background:var(--soft-panel);
      overflow:hidden;
    }
    .record-day-top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:8px;
      padding:10px 12px 8px;
      border-bottom:1px solid #d9e0e7;
    }
    .record-day-title{ font-size:16px; font-weight:800; color:#111827; }
    .record-day-time{ font-size:13px; font-weight:700; color:#374151; }

    .detail-list{ padding:8px 10px 0; display:flex; flex-direction:column; gap:8px; }
    .detail-item{
      background:#fff;
      border:1px solid #dde4eb;
      border-radius:12px;
      padding:8px 10px;
    }
    .detail-line{
      font-size:13px;
      line-height:1.6;
      color:#1f2937;
      word-break:break-word;
    }
    .detail-line.main{ font-weight:700; }
    .detail-line.sub{ color:#4b5563; }

    .summary-box{
      margin:10px;
      padding:10px 12px;
      border:1px solid var(--summary-border);
      border-radius:12px;
      background:var(--summary-bg);
    }
    .summary-title{
      font-size:13px;
      font-weight:800;
      color:#0f4c81;
      margin-bottom:6px;
    }
    .summary-line{
      font-size:13px;
      line-height:1.7;
      color:#1f2937;
    }
    .summary-line strong{ color:#111827; }
    .summary-alert{ font-weight:800; }
    .summary-alert.ok{ color:var(--ok); }
    .summary-alert.warn{ color:var(--warn); }
    .summary-alert.err{ color:var(--danger); }

    .record-empty{
      padding:14px;
      border:1px dashed #cbd5e1;
      border-radius:12px;
      text-align:center;
      color:#64748b;
      background:#f8fafc;
      font-size:14px;
    }

    .foot{ margin-top:16px; text-align:center; color:#9ca3af; font-size:12px; }

    @media (max-width: 680px){
      .task-grid{ grid-template-columns: repeat(4, 1fr); }
      .project-grid{ grid-template-columns: repeat(4, 1fr); }
      .unit-grid{ grid-template-columns: repeat(4, 1fr); }
      .weekday-grid{ grid-template-columns: repeat(7, 1fr); }
      .chip{ font-size:13px; min-height:40px; padding:7px 4px; }
    }

    @media (max-width: 560px){
      .wrap{ padding:0 8px 18px; }
      .card{ padding:10px 8px 14px; }
      .week-grid{ grid-template-columns: repeat(4, 1fr); }
      .weekday-grid{ grid-template-columns: repeat(7, 1fr); }
      .task-grid{ grid-template-columns: repeat(3, 1fr); }
      .project-grid{ grid-template-columns: repeat(3, 1fr); }
      .unit-grid{ grid-template-columns: repeat(3, 1fr); }
      .hours-box{ grid-template-columns:1fr 1fr; gap:8px; }
      .id-row{ grid-template-columns:repeat(3, minmax(0,1fr)); }
      .id-card{ padding:7px 8px; min-height:60px; }
      .id-label{ font-size:11px; }
      .id-value{ font-size:15px; }
      .chip-grid{ gap:5px; }
      .chip{ font-size:12px; min-height:38px; padding:6px 3px; border-radius:9px; }
      #projectChips .chip{ font-size:14px; font-weight:800; }
      #unitChips .chip{ font-size:13px; }
      .count-btn{ width:40px; height:40px; flex-basis:40px; }
      .count-value{ font-size:22px; }
      .quick-btn{ padding:4px 7px; font-size:12px; min-width:38px; }
      .record-day-top{ flex-direction:column; align-items:flex-start; }
      .record-day-time{ white-space:normal; }
      .detail-line, .summary-line{ font-size:12px; }
    }
  </style>
</head>
<body>
  <div class="header">车间工时填报系统</div>
  <div class="wrap">
    <div class="card">
      <div class="sec-title">身份确认</div>
      <div class="id-row">
        <div class="id-card">
          <div class="id-label">员工姓名</div>
          <div id="empName" class="id-value">--</div>
        </div>
        <div class="id-card">
          <div class="id-label">员工工号</div>
          <div id="empId" class="id-value">--</div>
        </div>
        <div class="id-card">
          <div class="id-label">识别状态</div>
          <div id="empState" class="id-value warn">待识别</div>
        </div>
      </div>

      <div class="tip">
        请选择本周、星期、工时类别、项目、单元并填写工时。<br>
        工作日只显示“工作日加班”，周末只显示“周末加班”。<br>
        选择 Week 后，下方会按“每天明细 + 每天汇总”显示已提交记录，并自动提示是否少填/多填。
      </div>

      <div class="sec-title">填写工时</div>
      <div class="field">
        <label>Week<span class="req">*</span></label>
        <div class="chip-grid week-grid" id="weekChips"></div>
      </div>
      <div class="field">
        <label>星期<span class="req">*</span></label>
        <div class="chip-grid weekday-grid" id="weekdayChips"></div>
      </div>
      <div class="field">
        <label>工时类别<span class="req">*</span></label>
        <div class="chip-grid task-grid" id="taskChips"></div>
      </div>
      <div class="field">
        <label>项目号<span class="req">*</span></label>
        <div class="chip-grid project-grid" id="projectChips"></div>
      </div>
      <div class="field">
        <label>单元号<span class="req">*</span></label>
        <div class="chip-grid unit-grid" id="unitChips"></div>
      </div>

      <div class="hours-box">
        <div class="hour-card">
          <div class="hour-title">正常工时（小时）<span class="req">*</span></div>
          <div class="count-row">
            <button class="count-btn" type="button" onclick="changeNumber('regularHours', -0.5)">-</button>
            <div class="count-value" id="regularHoursDisplay">8</div>
            <button class="count-btn" type="button" onclick="changeNumber('regularHours', 0.5)">+</button>
          </div>
          <div class="quick-row" id="regularHoursQuick"></div>
        </div>
        <div class="hour-card" id="weekdayOTCard">
          <div class="hour-title">工作日加班（小时）</div>
          <div class="count-row">
            <button class="count-btn" type="button" onclick="changeNumber('otWeekday', -0.5)">-</button>
            <div class="count-value" id="otWeekdayDisplay">0</div>
            <button class="count-btn" type="button" onclick="changeNumber('otWeekday', 0.5)">+</button>
          </div>
          <div class="quick-row" id="otWeekdayQuick"></div>
        </div>
        <div class="hour-card hidden" id="weekendOTCard">
          <div class="hour-title">周末加班（小时）</div>
          <div class="count-row">
            <button class="count-btn" type="button" onclick="changeNumber('otWeekend', -0.5)">-</button>
            <div class="count-value" id="otWeekendDisplay">0</div>
            <button class="count-btn" type="button" onclick="changeNumber('otWeekend', 0.5)">+</button>
          </div>
          <div class="quick-row" id="otWeekendQuick"></div>
        </div>
      </div>

      <div class="field" style="margin-top:14px;">
        <label for="remark">备注</label>
        <textarea id="remark" placeholder="可选"></textarea>
      </div>

      <div class="btn-area">
        <button id="submitBtn" class="btn btn-primary" onclick="submitForm()" disabled>提交工时</button>
      </div>

      <div id="msg" class="msg"></div>

      <div class="records-wrap">
        <div class="sec-title">本周已提交记录</div>
        <div class="record-tip">选择 Week 后会自动显示当前员工本周已提交的数据，按“每天明细 + 每天汇总”展示，方便对照纸质台账格式查漏补缺。</div>
        <div id="recordList" class="record-list">
          <div class="record-empty">请选择 Week 查看本周记录</div>
        </div>
      </div>

      <div class="foot">Ningbo Workshop Timesheet</div>
    </div>
  </div>

  <script>
    const API_URL = "https://api.baserow.io/api/database/rows/table/1030254/?user_field_names=true";
    const API_TOKEN = "vHwFROkQHYBYJck1Lv4i6kqitbbJI8e1";

    const employeeMap = {

    };

    const projectUnits = {
      "P0407596": ["U123","U123-1","U335","U343","U361","U368","U368-1","U368-3","U371","U373","U381","U382","U387","U451","U503","U641A","U641A-1","U641B","U641B-1","U641C","U641C-1"],
      "P0407596_v": ["536165"],
      "P0382530": ["U114-1","U125","U201A","U201B","U344","U361","U381","U401","P0335-DH2000A"],
      "P0382530_V": ["102821","105076","503842","532971","129822"],
      "P0373305": ["U121","U123","U123-1","U142","U335","U342","U361","U368","U368-1","U368-3","U381","U387","U503","U611","U611-A","U611-B","U611-C","U611-D"],
      "P88359": ["U201-2","U335","U341","U361","U371","U381","U451"],
      "P88359_V": ["536165"],
      "P0384374": ["U120","U126","U126-1","U335","U343","U361","U368","U368-1","U368-3","U371","U373","U381","U387","U451","U641A","U641B","U641C","U641D"],
      "P0384374_V": ["536474"]
    };

    const weekOptions = ["W25","W26","W27","W28"];
    const weekdayOptions = ["一","二","三","四","五","六","日"];
    const taskOptions = ["机械组装","保温作业","电气安装","收发料","物流发货","仓库帮忙","车间管理","其它工作","额外工时","请假"];
    const weekdayOrder = ["一","二","三","四","五","六","日"];

    const quickHoursMap = {
      regularHours: [0,1,2,3,4,8],
      otWeekday: [0,1,2,3,4],
      otWeekend: [0,1,2,3,4,8]
    };

    const state = {
      week: "",
      weekday: "",
      task: "",
      project: "",
      unit: "",
      regularHours: 8,
      otWeekday: 0,
      otWeekend: 0
    };

    let isSubmitting = false;
    let currentWeekRecords = [];

    function $(id){ return document.getElementById(id); }
    function getParam(name) { return new URL(window.location.href).searchParams.get(name); }
    function showMsg(text, ok = true){ const el = $("msg"); el.className = "msg " + (ok ? "ok" : "err"); el.innerHTML = text; }
    function safe(v){ return String(v ?? "").replace(/[<>&"]/g, s => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[s])); }

    function formatTime(v){
      if(!v) return "--";
      try{
        const d = new Date(v);
        if(isNaN(d.getTime())) return v;
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2,"0");
        const day = String(d.getDate()).padStart(2,"0");
        const hh = String(d.getHours()).padStart(2,"0");
        const mm = String(d.getMinutes()).padStart(2,"0");
        return `${y}-${m}-${day} ${hh}:${mm}`;
      }catch{ return v; }
    }

    function isWeekendDay(day){ return day === "六" || day === "日"; }

    function syncHourSectionByWeekday(){
      const hasDay = !!state.weekday;
      const weekend = isWeekendDay(state.weekday);
      if(!hasDay){
        $("weekdayOTCard").classList.remove("hidden");
        $("weekendOTCard").classList.add("hidden");
        refreshDisplays();
        return;
      }
      if(weekend){
        state.otWeekday = 0;
        $("weekdayOTCard").classList.add("hidden");
        $("weekendOTCard").classList.remove("hidden");
      }else{
        state.otWeekend = 0;
        if(state.otWeekday > 4) state.otWeekday = 4;
        $("weekdayOTCard").classList.remove("hidden");
        $("weekendOTCard").classList.add("hidden");
      }
      refreshDisplays();
    }

    function renderChips(containerId, values, fieldName, onClick){
      const container = $(containerId);
      container.innerHTML = "";
      if(!values || values.length === 0){
        const empty = document.createElement("div");
        empty.className = "chip disabled";
        empty.innerText = fieldName === "unit" ? "请先选项目" : "暂无数据";
        container.appendChild(empty);
        return;
      }
      values.forEach(v => {
        const chip = document.createElement("div");
        chip.className = "chip";
        chip.innerText = v;
        chip.dataset.value = v;
        chip.dataset.field = fieldName;
        chip.onclick = async () => {
          if(typeof onClick === "function") await onClick(v);
          else {
            state[fieldName] = v;
            if(fieldName === "weekday") syncHourSectionByWeekday();
            renderAllActiveChips();
          }
        };
        container.appendChild(chip);
      });
    }

    function renderAllActiveChips(){
      document.querySelectorAll(".chip").forEach(chip => {
        const field = chip.dataset.field;
        const value = chip.dataset.value;
        if(!field) return;
        chip.classList.toggle("active", state[field] === value);
      });
    }

    function renderProjectChips(){
      const projects = Object.keys(projectUnits);
      renderChips("projectChips", projects, "project", function(v){
        state.project = v; state.unit = ""; renderUnitChips(); renderAllActiveChips();
      });
    }

    function renderUnitChips(){
      const units = state.project && projectUnits[state.project] ? projectUnits[state.project] : [];
      renderChips("unitChips", units, "unit", function(v){ state.unit = v; renderAllActiveChips(); });
      renderAllActiveChips();
    }

    function renderQuickButtons(){
      renderQuickRow("regularHoursQuick", "regularHours", quickHoursMap.regularHours, true);
      renderQuickRow("otWeekdayQuick", "otWeekday", quickHoursMap.otWeekday, false);
      renderQuickRow("otWeekendQuick", "otWeekend", quickHoursMap.otWeekend, false);
    }

    function renderQuickRow(containerId, field, values, regular){
      const box = $(containerId); box.innerHTML = "";
      values.forEach(v => {
        const btn = document.createElement("button");
        btn.type = "button"; btn.className = "quick-btn";
        btn.textContent = v === 0 ? (regular ? "0小时" : "清零") : `${v}小时`;
        btn.onclick = function(){ setNumber(field, v); };
        box.appendChild(btn);
      });
    }

    function refreshDisplays(){
      $("regularHoursDisplay").innerText = state.regularHours;
      $("otWeekdayDisplay").innerText = state.otWeekday;
      $("otWeekendDisplay").innerText = state.otWeekend;
    }

    function getMaxHours(field){
      if(field === "otWeekday" && state.weekday && !isWeekendDay(state.weekday)) return 4;
      return 12;
    }

    function changeNumber(field, delta){
      let next = Math.round((Number(state[field] || 0) + delta) * 2) / 2;
      if(next < 0) next = 0;
      const max = getMaxHours(field);
      if(next > max) next = max;
      state[field] = next;
      refreshDisplays();
    }

    function setNumber(field, value){
      const max = getMaxHours(field);
      state[field] = Math.max(0, Math.min(value, max));
      refreshDisplays();
    }

    const empId = getParam("id");
    const empName = empId ? employeeMap[empId] : "";

    function initEmployee(){
      $("empId").innerText = empId || "--";
      if (empId && empName) {
        $("empName").innerText = empName;
        $("empState").innerText = "识别成功";
        $("empState").className = "id-value ok";
        $("submitBtn").disabled = false;
      } else if (empId) {
        $("empName").innerText = "未知员工";
        $("empState").innerText = "未在名单中";
        $("empState").className = "id-value err";
        $("submitBtn").disabled = true;
      } else {
        $("empName").innerText = "--";
        $("empState").innerText = "请扫码进入";
        $("empState").className = "id-value warn";
        $("submitBtn").disabled = true;
      }
    }

    async function loadWeekRecords(){
      if(!state.week || !empId){ renderWeekRecords([]); return; }
      try {
        const res = await fetch(API_URL, {
          method: "GET",
          headers: {"Authorization": "Token " + API_TOKEN, "Content-Type": "application/json"}
        });
        if(!res.ok) throw new Error("读取记录失败：" + res.status);
        const data = await res.json();
        let rows = [];
        if(Array.isArray(data)) rows = data;
        else if(Array.isArray(data.results)) rows = data.results;
        rows = rows.filter(r => String(r.employeeId || "") === String(empId) && String(r.week || "") === String(state.week));
        rows.sort((a,b)=> new Date(b.submitTime || 0).getTime() - new Date(a.submitTime || 0).getTime());
        currentWeekRecords = rows;
        renderWeekRecords(rows);
      } catch(e){
        renderWeekRecords([], "本周记录读取失败：" + e.message);
      }
    }

    function getSummaryStatusText(actual, target, label){
      if(actual === target) return `<span class="summary-alert ok">${label}已达标</span>`;
      if(actual < target) return `<span class="summary-alert warn">${label}少填 ${Number((target - actual).toFixed(2))}h</span>`;
      return `<span class="summary-alert err">${label}多填 ${Number((actual - target).toFixed(2))}h</span>`;
    }

    function renderWeekRecords(rows, errMsg = ""){
      const box = $("recordList");
      box.innerHTML = "";
      if(errMsg){ box.innerHTML = `<div class="record-empty">${safe(errMsg)}</div>`; return; }
      if(!state.week){ box.innerHTML = `<div class="record-empty">请选择 Week 查看本周记录</div>`; return; }
      if(!rows || rows.length === 0){ box.innerHTML = `<div class="record-empty">当前员工在 ${safe(state.week)} 还没有提交记录</div>`; return; }

      const groups = {};
      rows.forEach(r => {
        const day = String(r.weekday || "");
        if(!groups[day]) groups[day] = [];
        groups[day].push(r);
      });

      weekdayOrder.forEach(day => {
        const dayRows = groups[day];
        if(!dayRows || !dayRows.length) return;

        dayRows.sort((a,b)=> new Date(a.submitTime || 0).getTime() - new Date(b.submitTime || 0).getTime());
        const latestTime = formatTime(dayRows[dayRows.length - 1].submitTime || "");
        const regularTotal = dayRows.reduce((s,r)=> s + Number(r.regularHours || 0), 0);
        const otWeekdayTotal = dayRows.reduce((s,r)=> s + Number(r.otWeekday || 0), 0);
        const otWeekendTotal = dayRows.reduce((s,r)=> s + Number(r.otWeekend || 0), 0);
        const overtimeTotal = otWeekdayTotal + otWeekendTotal;
        const weekend = isWeekendDay(day);
        const regularTarget = 8;
        const overtimeTarget = 4;

        let detailsHtml = "";
        dayRows.forEach((r, idx) => {
          const overtimeValue = Number(r.otWeekday || 0) + Number(r.otWeekend || 0);
          detailsHtml += `
            <div class="detail-item">
              <div class="detail-line main">明细 ${idx + 1}：${safe(r.task || "")} ｜ ${safe(r.project || "")} ｜ ${safe(r.unit || "")}</div>
              <div class="detail-line sub">正常工时：${Number(r.regularHours || 0)}h ｜ 加班工时：${overtimeValue}h ｜ 提交时间：${safe(formatTime(r.submitTime))}</div>
              ${r.remark ? `<div class="detail-line sub">备注：${safe(r.remark)}</div>` : ""}
            </div>
          `;
        });

        const regularTip = getSummaryStatusText(regularTotal, regularTarget, "正常工时");
        const overtimeTip = getSummaryStatusText(overtimeTotal, overtimeTarget, weekend ? "加班工时" : "加班工时");
        const overtimeLabel = weekend ? `周末加班汇总：<strong>${otWeekendTotal}h / 目标 ${overtimeTarget}h</strong>` : `工作日加班汇总：<strong>${otWeekdayTotal}h / 目标 ${overtimeTarget}h</strong>`;

        const section = document.createElement("div");
        section.className = "record-day";
        section.innerHTML = `
          <div class="record-day-top">
            <div class="record-day-title">${safe(state.week)} · 星期${safe(day)}</div>
            <div class="record-day-time">最新提交：${safe(latestTime)}</div>
          </div>
          <div class="detail-list">${detailsHtml}</div>
          <div class="summary-box">
            <div class="summary-title">当日汇总</div>
            <div class="summary-line">正常工时汇总：<strong>${regularTotal}h / 目标 ${regularTarget}h</strong> ｜ ${regularTip}</div>
            <div class="summary-line">${overtimeLabel} ｜ ${overtimeTip}</div>
            <div class="summary-line">合计明细数：<strong>${dayRows.length}</strong> 条 ｜ ${weekend ? `周末加班明细 ${otWeekendTotal}h` : `工作日加班明细 ${otWeekdayTotal}h`}</div>
          </div>
        `;
        box.appendChild(section);
      });
    }

    function buildSubmitSignature(payload){
      return JSON.stringify({
        employeeId: payload.employeeId,
        week: payload.week,
        weekday: payload.weekday,
        task: payload.task,
        project: payload.project,
        unit: payload.unit,
        regularHours: Number(payload.regularHours),
        otWeekday: Number(payload.otWeekday),
        otWeekend: Number(payload.otWeekend),
        remark: String(payload.remark || "").trim()
      });
    }

    function existsExactDuplicate(signature){
      return currentWeekRecords.some(r => JSON.stringify({
        employeeId: r.employeeId,
        week: r.week,
        weekday: r.weekday,
        task: r.task,
        project: r.project,
        unit: r.unit,
        regularHours: Number(r.regularHours || 0),
        otWeekday: Number(r.otWeekday || 0),
        otWeekend: Number(r.otWeekend || 0),
        remark: String(r.remark || "").trim()
      }) === signature);
    }

    function isFastRepeat(signature){
      const prevSig = localStorage.getItem("last_submit_signature");
      const prevTs = Number(localStorage.getItem("last_submit_time") || 0);
      return prevSig === signature && (Date.now() - prevTs) < 15000;
    }

    function saveLastSubmit(signature){
      localStorage.setItem("last_submit_signature", signature);
      localStorage.setItem("last_submit_time", String(Date.now()));
    }

    function validate(){
      if(!empId || !empName) return "未识别到有效员工信息，请使用员工专属二维码扫码。";
      if(!state.week) return "请选择 Week。";
      if(!state.weekday) return "请选择星期。";
      if(!state.task) return "请选择工时类别。";
      if(!state.project) return "请选择项目号。";
      if(!state.unit) return "请选择单元号。";
      if(state.regularHours < 0 || state.regularHours > 12) return "正常工时必须在 0~12 之间。";
      if(!isWeekendDay(state.weekday) && (state.otWeekday < 0 || state.otWeekday > 4)) return "工作日加班必须在 0~4 小时之间。";
      if(isWeekendDay(state.weekday) && state.otWeekday !== 0) return "周末不能填写工作日加班。";
      if(!isWeekendDay(state.weekday) && state.otWeekend !== 0) return "工作日不能填写周末加班。";
      if(state.otWeekend < 0 || state.otWeekend > 12) return "周末加班必须在 0~12 之间。";
      return "";
    }

    async function submitForm(){
      if(isSubmitting){ showMsg("正在提交中，请勿重复点击。", false); return; }
      const err = validate();
      if(err){ showMsg(err, false); return; }
      if(!API_TOKEN || API_TOKEN.includes("请替换成你自己的Baserow Token")){
        showMsg("请先把代码里的 API_TOKEN 替换成你自己的 Baserow token。", false); return;
      }

      const payload = {
        submitTime: new Date().toISOString(),
        employeeId: empId,
        employeeName: empName,
        week: state.week,
        weekday: state.weekday,
        task: state.task,
        project: state.project,
        unit: state.unit,
        regularHours: Number(state.regularHours),
        otWeekday: Number(state.otWeekday),
        otWeekend: Number(state.otWeekend),
        remark: $("remark").value || ""
      };

      const signature = buildSubmitSignature(payload);
      if(isFastRepeat(signature)){ showMsg("请勿连续重复提交完全相同的数据。", false); return; }
      if(existsExactDuplicate(signature)){ showMsg("本周已存在一条完全相同的记录，无需重复提交。", false); return; }

      try{
        isSubmitting = true;
        $("submitBtn").disabled = true;
        showMsg("正在提交，请稍候…", true);
        const res = await fetch(API_URL, {
          method: "POST",
          headers: {"Authorization": "Token " + API_TOKEN, "Content-Type": "application/json"},
          body: JSON.stringify(payload)
        });
        if(!res.ok) throw new Error("接口返回失败状态：" + res.status);
        saveLastSubmit(signature);
        showMsg("✅ 提交成功。", true);

        state.weekday = "";
        state.task = "";
        state.project = "";
        state.unit = "";
        state.regularHours = 8;
        state.otWeekday = 0;
        state.otWeekend = 0;
        $("remark").value = "";

        renderAllActiveChips();
        refreshDisplays();
        renderProjectChips();
        renderUnitChips();
        syncHourSectionByWeekday();
        await loadWeekRecords();
      }catch(e){
        showMsg("❌ 提交失败：" + e.message, false);
      }finally{
        isSubmitting = false;
        $("submitBtn").disabled = !(empId && empName);
      }
    }

    function init(){
      initEmployee();
      renderChips("weekChips", weekOptions, "week", async function(v){ state.week = v; renderAllActiveChips(); await loadWeekRecords(); });
      renderChips("weekdayChips", weekdayOptions, "weekday", function(v){ state.weekday = v; syncHourSectionByWeekday(); renderAllActiveChips(); });
      renderChips("taskChips", taskOptions, "task");
      renderProjectChips();
      renderUnitChips();
      renderQuickButtons();
      renderAllActiveChips();
      refreshDisplays();
      syncHourSectionByWeekday();
      renderWeekRecords([]);
    }

    init();
  </script>
</body>
</html>
