}

function getWeek() {
  const d = new Date();
  const onejan = new Date(d.getFullYear(), 0, 1);
  return Math.ceil((((d - onejan) / 86400000) + onejan.getDay() + 1) / 7);
}

let rows = [];

// ===== 新增行 =====
function addRow() {
  rows.push({
    type: "机械组装",
    project: "",
    prod: "",
    unit: "",
    note: "",
    day: getTodayCN(),
    regular: "8",
    overtime: ""
  });
  render();
}

// ===== 删除行 =====
function delRow(i) {
  rows.splice(i, 1);
  if (rows.length === 0) addRow();
  else render();
}

// ===== 普通赋值 =====
function setVal(i, key, value) {
  rows[i][key] = value;
  render();
}

// ===== 先选项目号 =====
function setProject(i, value) {
  rows[i].project = value;
  rows[i].prod = "";
  rows[i].unit = "";
  render();
}

// ===== 生产号 =====
function setProd(i, value) {
  rows[i].prod = value;
  if (productionMap[value]) {
    rows[i].project = productionMap[value].project;
    rows[i].unit = productionMap[value].unit;
  } else {
    rows[i].unit = "";
  }
  render();
}

// ===== 单元号 =====
function setUnit(i, value) {
  rows[i].unit = value;
  const currentProject = rows[i].project;
  const list = projectMap[currentProject] || [];
  const found = list.find(x => x.unit === value);
  rows[i].prod = found ? found.prod : "";
  render();
}

function getProdOptions(project) {
  if (!project || !projectMap[project]) return [];
  return projectMap[project].map(x => x.prod);
}

function getUnitOptions(project) {
  if (!project || !projectMap[project]) return [];
  return projectMap[project].map(x => x.unit);
}

// ===== 渲染 =====
function render() {
  let tb = "";
  let sumR = 0;
  let sumO = 0;

  rows.forEach((r, i) => {
    const prodList = getProdOptions(r.project);
    const unitList = getUnitOptions(r.project);

    sumR += Number(r.regular || 0);
    sumO += Number(r.overtime || 0);

    tb += `
      <tr>
        <td><button onclick="delRow(${i})">删</button></td>
        <td>${i + 1}</td>

        <td>
          <select onchange="setVal(${i}, 'type', this.value)">
            ${workTypes.map(t => `<option ${t === r.type ? "selected" : ""}>${t}</option>`).join("")}
          </select>
        </td>

        <td>
          <select onchange="setProject(${i}, this.value)">
            <option value=""></option>
            ${projectList.map(p => `<option value="${p}" ${p === r.project ? "selected" : ""}>${p}</option>`).join("")}
          </select>
        </td>

        <td>
          <select onchange="setProd(${i}, this.value)">
            <option value=""></option>
            ${prodList.map(p => `<option value="${p}" ${p === r.prod ? "selected" : ""}>${p}</option>`).join("")}
          </select>
        </td>

        <td>
          <select onchange="setUnit(${i}, this.value)">
            <option value=""></option>
            ${unitList.map(u => `<option value="${u}" ${u === r.unit ? "selected" : ""}>${u}</option>`).join("")}
          </select>
        </td>

        <td>
          ${r.type === "额外工时"
            ? `<input list="extraNoteList" value="${escapeHtml(r.note || "")}" onchange="setVal(${i}, 'note', this.value)">`
            : `<input value="${escapeHtml(r.note || "")}" onchange="setVal(${i}, 'note', this.value)">`}
        </td>

        <td>
          <select onchange="setVal(${i}, 'day', this.value)">
            ${days.map(d => `<option ${d === r.day ? "selected" : ""}>${d}</option>`).join("")}
          </select>
        </td>

        <td><input type="number" step="0.5" value="${r.regular}" onchange="setVal(${i}, 'regular', this.value)"></td>
        <td><input type="number" step="0.5" value="${r.overtime}" onchange="setVal(${i}, 'overtime', this.value)"></td>
      </tr>
    `;
  });

  document.getElementById("tbody").innerHTML = tb;
  document.getElementById("sumR").innerText = sumR;
  document.getElementById("sumO").innerText = sumO;
}

// ===== 提交校验 =====
function submitForm() {
  let err = [];
  const total = {};
  days.forEach(d => total[d] = 0);

  rows.forEach((r, i) => {
    if (!r.type) err.push(`第${i + 1}行未选工时类别`);
    if (!r.project) err.push(`第${i + 1}行未选项目号`);
    if (!r.prod) err.push(`第${i + 1}行未选生产号`);
    if (!r.unit) err.push(`第${i + 1}行未选单元号`);
    if (r.regular === "" || isNaN(Number(r.regular))) err.push(`第${i + 1}行正班错误`);
    if (r.overtime !== "" && isNaN(Number(r.overtime))) err.push(`第${i + 1}行夜加班错误`);

    total[r.day] += Number(r.regular || 0);

    if (Number(r.overtime || 0) > 8) {
      err.push(`第${i + 1}行夜加班异常`);
    }
  });

  ["星期一","星期二","星期三","星期四","星期五"].forEach(d => {
    if (total[d] !== 0 && total[d] !== 8) {
      err.push(`${d}正班必须=8`);
    }
  });

  if (err.length) {
    msg(err.join("<br>"));
    return;
  }

  msg("提交成功");
}

// ===== 保存 =====
function save() {
  localStorage.setItem("data_" + id, JSON.stringify(rows));
  msg("已保存");
}

function msg(t) {
  document.getElementById("msg").innerHTML = t;
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\"/g, "&quot;");
}

// ===== 恢复保存数据 =====
try {
  const saved = JSON.parse(localStorage.getItem("data_" + id) || "null");
  if (saved && Array.isArray(saved) && saved.length) {
    rows = saved;
  }
} catch (e) {}

if (rows.length === 0) {
  addRow();
} else {
  render();
}
</script>

</body>
</html>
``
